name: Release

# On a version tag (v*): test, deploy the site to GitHub Pages at htllm.rjtpp.com (the
# custom domain is set in the repo's Pages settings), and attach the same build as an
# offline zip to a draft release. Run by hand, it tests and deploys without touching
# releases. Actions are pinned to commit SHAs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload the zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Make sure Chrome is available for the browser suite
        run: command -v google-chrome || pnpm exec playwright install --with-deps chrome

      # Check that the app still works when hosted under a path (not deployed).
      - run: pnpm build:subpath
      - run: pnpm test:browser:subpath

      # The release build, base /: deployed to Pages and zipped for offline use.
      - run: pnpm build
      - run: pnpm test:browser
      - name: Zip the offline build
        run: cd dist && zip -qr "../htllm-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Attach the zip to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="htllm-${GITHUB_REF_NAME}.zip"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$zip" --draft --title "htllm $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --draft --title "htllm $GITHUB_REF_NAME" --notes "Release notes to follow."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
