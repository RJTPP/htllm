{

<body>
<div id="root">
  <div class="flex items-center justify-center min-h-screen">
    <div class="font-mono text-sm text-mute flex items-center gap-2">
      <span class="inline-block w-2 h-2 bg-accent rounded-full pulse-dot"></span>
      Initializing runtime…
    </div>
  </div>
</div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef, useMemo, useCallback } from "react";
import { createRoot } from "react-dom/client";
import * as webllm from "@mlc-ai/web-llm";

/* ============ utils ============ */

function fmtMB(mb) {
  if (mb == null) return "—";
  if (mb < 1024) return `${Math.round(mb)} MB`;
  return `${(mb / 1024).toFixed(1)} GB`;
}
function fmtBytes(b) {
  if (b == null) return "—";
  const GB = 1024 ** 3;
  if (b >= GB) return `${(b / GB).toFixed(1)} GB`;
  const MB = 1024 ** 2;
  return `${(b / MB).toFixed(0)} MB`;
}
function shortenId(id) {
  return id.replace(/-MLC$/, "").replace(/-q4f\d+_\d+/, "");
}
function quantTag(id) {
  const m = id.match(/q(\d)f(\d+)/);
  return m ? `q${m[1]}` : "fp";
}

async function detectSystem() {
  const info = {
    webgpu: "gpu" in navigator,
    deviceMemoryGB: navigator.deviceMemory || null,
    cores: navigator.hardwareConcurrency || null,
    gpu: null,
    gpuError: null,
    storage: null,
    connection: null,
    ua: navigator.userAgent,
  };

  if (info.webgpu) {
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (adapter) {
        info.gpu = {
          info: adapter.info || null,
          maxBufferSize: adapter.limits.maxBufferSize,
          maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        };
      } else {
        info.gpuError = "No GPU adapter returned";
      }
    } catch (e) {
      info.gpuError = e.message || String(e);
    }
  }

  try {
    const est = await navigator.storage.estimate();
    info.storage = { quota: est.quota, usage: est.usage, free: (est.quota || 0) - (est.usage || 0) };
  } catch {}

  if (navigator.connection) {
    info.connection = {
      effectiveType: navigator.connection.effectiveType,
      downlink: navigator.connection.downlink,
    };
  }

  return info;
}

/* ============ atoms ============ */

const Badge = ({ tone = "neutral", children, mono = true }) => {
  const tones = {
    neutral: "border-line text-mute",
    ok: "border-ok/40 text-ok bg-ok/5",
    warn: "border-warn/40 text-warn bg-warn/5",
    err: "border-err/40 text-err bg-err/5",
    accent: "border-accent/40 text-accent bg-accent/5",
  };
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 text-[11px] border ${tones[tone]} ${mono ? "font-mono" : ""}`}>
      {children}
    </span>
  );
};

const Dot = ({ tone = "mute" }) => {
  const colors = { mute: "bg-mute", ok: "bg-ok", warn: "bg-warn", err: "bg-err", accent: "bg-accent" };
  return <span className={`w-1.5 h-1.5 rounded-full ${colors[tone]}`} />;
};

/* ============ system rail ============ */

function SystemRail({ system }) {
  if (!system) {
    return (
      <div className="flex items-center gap-3 font-mono text-xs text-mute">
        <span className="pulse-dot inline-block w-1.5 h-1.5 bg-accent rounded-full" />
        probing…
      </div>
    );
  }

  const webgpuTone = system.webgpu ? "ok" : "err";
  const ramTone = !system.deviceMemoryGB ? "neutral" : system.deviceMemoryGB >= 8 ? "ok" : system.deviceMemoryGB >= 4 ? "warn" : "err";
  const storageTone = system.storage && system.storage.free > 2 * 1024 ** 3 ? "ok" : "warn";

  return (
    <div className="flex flex-wrap items-center gap-2">
      <Badge tone={webgpuTone}>
        <Dot tone={webgpuTone} /> WebGPU {system.webgpu ? "ok" : "absent"}
      </Badge>
      <Badge tone={ramTone}>
        RAM {system.deviceMemoryGB ? `≥${system.deviceMemoryGB} GB` : "unknown"}
      </Badge>
      <Badge tone="neutral">CPU {system.cores ?? "?"}c</Badge>
      {system.gpu && (
        <Badge tone="neutral">
          buf {fmtBytes(system.gpu.maxBufferSize)}
        </Badge>
      )}
      {system.storage && (
        <Badge tone={storageTone}>
          free {fmtBytes(system.storage.free)}
        </Badge>
      )}
      {system.connection && (
        <Badge tone="neutral">
          net {system.connection.effectiveType}
          {system.connection.downlink ? ` · ${system.connection.downlink}Mbps` : ""}
        </Badge>
      )}
    </div>
  );
}

/* ============ model card ============ */

function ModelCard({ model, isSelected, isLoaded, isRecommended, isFits, isTight, onSelect, onLoad, onUnload, onDelete, status }) {
  const vram = model.vram_required_MB;
  const fitTone = isLoaded ? "accent" : isFits ? "ok" : isTight ? "warn" : "err";
  const baseCls = `relative border w-full text-left transition-colors ${
    isSelected ? "border-accent/70 bg-accent/5" : "border-line bg-surface hover:bg-surface2 hover:border-lineHi"
  }`;

  return (
    <div className={baseCls}>
      <button onClick={() => onSelect(model.model_id)} className="block w-full text-left px-3 py-2.5">
        <div className="flex items-baseline justify-between gap-2">
          <div className="font-mono text-[13px] text-text truncate">{shortenId(model.model_id)}</div>
          <div className="font-mono text-[11px] text-mute shrink-0">{fmtMB(vram)}</div>
        </div>
        <div className="mt-1.5 flex flex-wrap items-center gap-1.5">
          <span className="font-mono text-[10px] text-mute uppercase tracking-wider">{quantTag(model.model_id)}</span>
          {isRecommended && !isLoaded && <Badge tone="accent">recommended</Badge>}
          {isLoaded && <Badge tone="accent"><span className="pulse-dot inline-block w-1.5 h-1.5 bg-accent rounded-full" />loaded</Badge>}
          {model.cached && !isLoaded && <Badge tone="ok">cached</Badge>}
          {!isFits && !isLoaded && <Badge tone="err">too large</Badge>}
          {isTight && !isLoaded && <Badge tone="warn">tight fit</Badge>}
        </div>
      </button>

      {isSelected && (
        <div className="border-t border-line px-3 py-2 flex items-center gap-2 bg-bg/40">
          {!isLoaded ? (
            <button
              onClick={() => onLoad(model.model_id)}
              disabled={status === "loading"}
              className="font-mono text-[11px] px-2.5 py-1 border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              {status === "loading" ? "loading…" : model.cached ? "load (cached)" : "download & load"}
            </button>
          ) : (
            <button
              onClick={onUnload}
              className="font-mono text-[11px] px-2.5 py-1 border border-line text-mute hover:bg-surface2 hover:text-text"
            >
              unload
            </button>
          )}
          {model.cached && (
            <button
              onClick={() => onDelete(model.model_id)}
              className="font-mono text-[11px] px-2.5 py-1 border border-line text-mute hover:bg-err/10 hover:text-err hover:border-err/40"
              title="Delete from browser cache"
            >
              evict
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ============ chat ============ */

function Chat({ messages, input, setInput, onSend, onClear, generating, onStop, loadedModelId, modelReady }) {
  const scrollRef = useRef(null);
  const taRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages]);

  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 180) + "px";
  }, [input]);

  const handleKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      onSend();
    }
  };

  const empty = messages.length === 0;

  return (
    <div className="flex flex-col h-full min-h-0">
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-6 py-6">
        {empty ? (
          <EmptyState modelReady={modelReady} loadedModelId={loadedModelId} />
        ) : (
          <div className="max-w-3xl mx-auto space-y-6">
            {messages.map((m, i) => (
              <Message key={i} message={m} loadedModelId={loadedModelId} streaming={generating && i === messages.length - 1 && m.role === "assistant"} />
            ))}
          </div>
        )}
      </div>

      <div className="border-t border-line bg-bg">
        <div className="max-w-3xl mx-auto px-6 py-3">
          <div className="flex items-end gap-2">
            <textarea
              ref={taRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKey}
              placeholder={modelReady ? "Type a message — Enter to send, Shift+Enter for newline" : "Load a model to begin"}
              disabled={!modelReady}
              rows={1}
              className="flex-1 resize-none bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[14px] text-text placeholder:text-mute font-sans disabled:opacity-40"
              style={{ maxHeight: "180px" }}
            />
            {generating ? (
              <button
                onClick={onStop}
                className="font-mono text-[12px] px-3 py-2 border border-err/60 text-err hover:bg-err/10"
              >
                stop
              </button>
            ) : (
              <button
                onClick={onSend}
                disabled={!modelReady || !input.trim()}
                className="font-mono text-[12px] px-3 py-2 border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-30 disabled:cursor-not-allowed"
              >
                send →
              </button>
            )}
          </div>
          <div className="mt-2 flex items-center justify-between font-mono text-[10px] text-mute">
            <span>{modelReady ? `model: ${shortenId(loadedModelId || "")}` : "no model loaded"}</span>
            <button onClick={onClear} disabled={empty || generating} className="hover:text-text disabled:opacity-30 disabled:cursor-not-allowed">
              clear thread
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Message({ message, loadedModelId, streaming }) {
  const isUser = message.role === "user";
  return (
    <div className="space-y-1.5">
      <div className="font-mono text-[10px] uppercase tracking-widest text-mute">
        {isUser ? "you" : shortenId(loadedModelId || "model")}
      </div>
      <div className={`${isUser ? "text-text" : "text-text font-mono text-[13.5px] leading-relaxed"} whitespace-pre-wrap break-words`}>
        {message.content}
        {streaming && <span className="inline-block w-1.5 h-3.5 bg-accent ml-0.5 align-middle pulse-dot" />}
      </div>
    </div>
  );
}

function EmptyState({ modelReady, loadedModelId }) {
  return (
    <div className="max-w-2xl mx-auto py-10">
      <div className="border border-line bg-surface p-6">
        <div className="font-mono text-[10px] text-accent uppercase tracking-widest mb-2">README</div>
        <h2 className="text-lg font-medium mb-3">Local-only chat. No server.</h2>
        <p className="text-sm text-mute leading-relaxed">
          Models run entirely in your browser via WebGPU. Weights are downloaded once and cached, then never leave your device. The first
          load can take a while (large download); subsequent loads are seconds.
        </p>
        <div className="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono text-[11px]">
          <div className="border border-line p-3">
            <div className="text-accent mb-1">1 · pick</div>
            <div className="text-mute">Choose a model from the rail. Smallest first.</div>
          </div>
          <div className="border border-line p-3">
            <div className="text-accent mb-1">2 · load</div>
            <div className="text-mute">First time downloads weights to browser cache.</div>
          </div>
          <div className="border border-line p-3">
            <div className="text-accent mb-1">3 · chat</div>
            <div className="text-mute">Generation happens on your GPU.</div>
          </div>
        </div>
        {modelReady && (
          <div className="mt-4 font-mono text-[11px] text-ok">
            ✓ {shortenId(loadedModelId)} is loaded — type below to begin.
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ status panel ============ */

function StatusPanel({ engineStatus, loadProgress, loadedModelId, system }) {
  if (engineStatus === "idle") return null;

  const isLoading = engineStatus === "loading";
  const isError = engineStatus === "error";
  const pct = Math.round((loadProgress.progress || 0) * 100);

  return (
    <div className={`border-l-2 ${isError ? "border-err" : isLoading ? "border-accent" : "border-ok"} bg-surface px-3 py-2.5`}>
      <div className="flex items-center justify-between mb-1">
        <div className="font-mono text-[10px] uppercase tracking-widest text-mute">
          {isLoading ? "loading" : isError ? "error" : "ready"}
        </div>
        {isLoading && <div className="font-mono text-[11px] text-accent">{pct}%</div>}
      </div>
      <div className={`font-mono text-[11px] ${isError ? "text-err" : "text-text"} break-words leading-snug`}>
        {loadProgress.text || shortenId(loadedModelId || "")}
      </div>
      {isLoading && (
        <div className="mt-2 h-1 bg-bg border border-line overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{ width: `${pct}%` }} />
        </div>
      )}
    </div>
  );
}

/* ============ app ============ */

function App() {
  const [system, setSystem] = useState(null);
  const [models, setModels] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [loadedId, setLoadedId] = useState(null);
  const [engineStatus, setEngineStatus] = useState("idle"); // idle | loading | ready | error
  const [loadProgress, setLoadProgress] = useState({ progress: 0, text: "" });
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [generating, setGenerating] = useState(false);
  const [hideTooLarge, setHideTooLarge] = useState(true);

  const engineRef = useRef(null);
  const abortRef = useRef(null);

  const isFileProtocol = typeof location !== "undefined" && location.protocol === "file:";

  // Detect system on mount
  useEffect(() => {
    detectSystem().then(setSystem);
  }, []);

  // Build the model list once system is known
  useEffect(() => {
    (async () => {
      const list = webllm.prebuiltAppConfig.model_list || [];
      // Keep instruction-tuned chat models, drop embeddings / non-chat
      const chat = list.filter((m) => {
        const id = m.model_id.toLowerCase();
        return (id.includes("instruct") || id.includes("chat") || id.includes("hermes")) && !id.includes("embed");
      });
      // Sort by VRAM ascending — small first
      chat.sort((a, b) => (a.vram_required_MB || 99999) - (b.vram_required_MB || 99999));
      // Check cache for each
      const withCache = await Promise.all(
        chat.map(async (m) => ({
          ...m,
          cached: await webllm.hasModelInCache(m.model_id).catch(() => false),
        })),
      );
      setModels(withCache);

      // Auto-select smallest cached, else smallest overall
      const cached = withCache.find((m) => m.cached);
      setSelectedId((prev) => prev || (cached ? cached.model_id : withCache[0]?.model_id));
    })();
  }, []);

  // Heuristic: what fits this device?
  const fitFor = useCallback(
    (vram) => {
      if (vram == null) return { fits: false, tight: false };
      const ramGB = system?.deviceMemoryGB || 4;
      // Conservative: browser GPU memory ≈ system RAM * 0.6 (integrated GPUs share)
      const budgetMB = ramGB * 1024 * 0.7;
      const fits = vram <= budgetMB;
      const tight = !fits && vram <= ramGB * 1024;
      return { fits, tight };
    },
    [system],
  );

  // Recommended = first model that fits comfortably
  const recommendedId = useMemo(() => {
    for (const m of models) {
      const { fits } = fitFor(m.vram_required_MB);
      if (fits) return m.model_id;
    }
    return models[0]?.model_id || null;
  }, [models, fitFor]);

  const visibleModels = useMemo(() => {
    if (!hideTooLarge) return models;
    return models.filter((m) => {
      const { fits, tight } = fitFor(m.vram_required_MB);
      return fits || tight || m.cached || m.model_id === loadedId;
    });
  }, [models, hideTooLarge, fitFor, loadedId]);

  /* ============ engine ops ============ */

  const loadModel = async (modelId) => {
    if (isFileProtocol) {
      setEngineStatus("error");
      setLoadProgress({ progress: 0, text: "Cannot load over file:// — serve via HTTP first." });
      return;
    }
    setEngineStatus("loading");
    setLoadProgress({ progress: 0, text: "Initializing engine…" });

    // Unload any currently loaded model first
    if (engineRef.current) {
      try {
        await engineRef.current.unload();
      } catch {}
      engineRef.current = null;
      setLoadedId(null);
    }

    try {
      const eng = await webllm.CreateMLCEngine(modelId, {
        initProgressCallback: (r) => {
          setLoadProgress({ progress: r.progress, text: r.text });
        },
      });
      engineRef.current = eng;
      setLoadedId(modelId);
      setEngineStatus("ready");
      setLoadProgress({ progress: 1, text: "Ready" });
      setMessages([]);
      setModels((prev) => prev.map((m) => (m.model_id === modelId ? { ...m, cached: true } : m)));
    } catch (err) {
      console.error(err);
      setEngineStatus("error");
      setLoadProgress({ progress: 0, text: err.message || String(err) });
    }
  };

  const unloadModel = async () => {
    if (!engineRef.current) return;
    try {
      await engineRef.current.unload();
    } catch (e) {
      console.warn("unload error:", e);
    }
    engineRef.current = null;
    setLoadedId(null);
    setEngineStatus("idle");
    setLoadProgress({ progress: 0, text: "" });
    setMessages([]);
  };

  const deleteCached = async (modelId) => {
    if (modelId === loadedId) await unloadModel();
    try {
      await webllm.deleteModelAllInfoInCache(modelId);
    } catch (e) {
      console.warn("cache delete error:", e);
    }
    setModels((prev) => prev.map((m) => (m.model_id === modelId ? { ...m, cached: false } : m)));
  };

  const sendMessage = async () => {
    if (!engineRef.current || !input.trim() || generating) return;
    const userMsg = { role: "user", content: input.trim() };
    const history = [...messages, userMsg];
    setMessages([...history, { role: "assistant", content: "" }]);
    setInput("");
    setGenerating(true);

    const controller = new AbortController();
    abortRef.current = controller;

    try {
      const stream = await engineRef.current.chat.completions.create({
        messages: history,
        stream: true,
        temperature: 0.7,
      });

      let full = "";
      for await (const chunk of stream) {
        if (controller.signal.aborted) {
          try { await engineRef.current.interruptGenerate(); } catch {}
          break;
        }
        const delta = chunk.choices?.[0]?.delta?.content || "";
        full += delta;
        setMessages((prev) => {
          const copy = prev.slice();
          copy[copy.length - 1] = { role: "assistant", content: full };
          return copy;
        });
      }
    } catch (err) {
      setMessages((prev) => {
        const copy = prev.slice();
        copy[copy.length - 1] = { role: "assistant", content: `[error] ${err.message || String(err)}` };
        return copy;
      });
    } finally {
      setGenerating(false);
      abortRef.current = null;
    }
  };

  const stopGenerate = () => {
    if (abortRef.current) abortRef.current.abort();
    if (engineRef.current) {
      try { engineRef.current.interruptGenerate(); } catch {}
    }
  };

  /* ============ render ============ */

  const noWebGPU = system && !system.webgpu;

  return (
    <div className="h-screen flex flex-col bg-bg text-text overflow-hidden">
      {/* Header */}
      <header className="border-b border-line bg-bg/80 backdrop-blur">
        <div className="px-5 py-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-3">
            <div className="w-7 h-7 border border-accent/60 bg-accent/5 flex items-center justify-center">
              <span className="font-mono text-[11px] text-accent font-bold">L³</span>
            </div>
            <div>
              <div className="font-mono text-[14px] tracking-tight">local-llm-lab</div>
              <div className="font-mono text-[10px] text-mute -mt-0.5">in-browser inference · webgpu · @mlc-ai/web-llm</div>
            </div>
          </div>
          <SystemRail system={system} />
        </div>
      </header>

      {/* file:// warning banner */}
      {isFileProtocol && (
        <div className="border-b-2 border-err bg-err/10 px-5 py-3">
          <div className="flex items-start gap-3 max-w-5xl">
            <span className="font-mono text-[10px] text-err uppercase tracking-widest mt-0.5 shrink-0 px-1.5 py-0.5 border border-err/60 bg-err/10">blocking</span>
            <div className="font-mono text-[11px] text-text leading-relaxed">
              <div className="text-err font-bold mb-1">Cannot load models from <code>file://</code> — HuggingFace fetches are CORS-blocked.</div>
              <div>
                Run a local HTTP server in the folder containing this file:
              </div>
              <div className="mt-1.5 space-y-0.5 pl-3 border-l border-err/40">
                <div><code className="text-accent">python3 -m http.server 8000</code> &nbsp;→&nbsp; <code className="text-accent">http://localhost:8000/local-llm-lab.html</code></div>
                <div><code className="text-accent">npx serve .</code> &nbsp;or&nbsp; <code className="text-accent">npx http-server</code></div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* WebGPU block screen */}
      {noWebGPU && (
        <div className="flex-1 grid-bg flex items-center justify-center p-6">
          <div className="max-w-md border border-err/40 bg-err/5 p-6">
            <div className="font-mono text-[10px] text-err uppercase tracking-widest mb-2">runtime missing</div>
            <h2 className="text-lg font-medium mb-2">WebGPU not available</h2>
            <p className="text-sm text-mute leading-relaxed">
              This tool requires WebGPU. Try the latest Chrome, Edge, or Chrome Canary on a desktop with a discrete or integrated GPU.
              Mobile and Firefox don't yet expose WebGPU consistently.
            </p>
          </div>
        </div>
      )}

      {!noWebGPU && (
        <div className="flex-1 flex min-h-0">
          {/* Left rail */}
          <aside className="w-[340px] border-r border-line bg-bg flex flex-col min-h-0">
            <div className="px-3 py-2.5 border-b border-line flex items-center justify-between">
              <div className="font-mono text-[10px] uppercase tracking-widest text-mute">models · {visibleModels.length}/{models.length}</div>
              <label className="flex items-center gap-1.5 font-mono text-[10px] text-mute cursor-pointer hover:text-text">
                <input
                  type="checkbox"
                  checked={hideTooLarge}
                  onChange={(e) => setHideTooLarge(e.target.checked)}
                  className="accent-accent"
                />
                fit only
              </label>
            </div>

            <div className="flex-1 overflow-y-auto px-2 py-2 space-y-1.5">
              {models.length === 0 ? (
                <div className="font-mono text-[11px] text-mute px-2 py-3">loading model catalogue…</div>
              ) : visibleModels.length === 0 ? (
                <div className="font-mono text-[11px] text-mute px-2 py-3">
                  no models fit detected RAM. uncheck "fit only" to see all.
                </div>
              ) : (
                visibleModels.map((m) => {
                  const { fits, tight } = fitFor(m.vram_required_MB);
                  return (
                    <ModelCard
                      key={m.model_id}
                      model={m}
                      isSelected={selectedId === m.model_id}
                      isLoaded={loadedId === m.model_id}
                      isRecommended={recommendedId === m.model_id}
                      isFits={fits || m.cached}
                      isTight={tight}
                      status={engineStatus}
                      onSelect={setSelectedId}
                      onLoad={loadModel}
                      onUnload={unloadModel}
                      onDelete={deleteCached}
                    />
                  );
                })
              )}
            </div>

            {/* Status footer in sidebar */}
            <div className="border-t border-line p-2">
              {engineStatus !== "idle" ? (
                <StatusPanel engineStatus={engineStatus} loadProgress={loadProgress} loadedModelId={loadedId} system={system} />
              ) : (
                <div className="font-mono text-[10px] text-mute px-2 py-1.5">no model loaded · select one to begin</div>
              )}
            </div>
          </aside>

          {/* Main chat */}
          <main className="flex-1 flex flex-col min-w-0 min-h-0 grid-bg">
            <Chat
              messages={messages}
              input={input}
              setInput={setInput}
              onSend={sendMessage}
              onStop={stopGenerate}
              onClear={() => setMessages([])}
              generating={generating}
              loadedModelId={loadedId}
              modelReady={engineStatus === "ready" && !!engineRef.current}
            />
          </main>
        </div>
      )}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
