/* ============ utils ============ */

function fmtMB(mb) {
  if (mb == null) return "—";
  if (mb < 1024) return `${Math.round(mb)} MB`;
  return `${(mb / 1024).toFixed(1)} GB`;
}
function fmtBytes(b) {
  if (b == null) return "—";
  const GB = 1024 ** 3;
  if (b >= GB) return `${(b / GB).toFixed(1)} GB`;
  return `${(b / 1024 ** 2).toFixed(0)} MB`;
}
function shortenId(id) {
  return (id || "").replace(/-MLC$/, "").replace(/-q\df\d+_\d+/, "");
}
function familyOf(modelId) {
  const m = MOCK_MODELS.find((x) => x.variants.some((v) => v.id === modelId));
  return m ? m.family : null;
}
function fitFor(vram, ramGB) {
  const budget = (ramGB || 4) * 1024 * 0.7;
  const fits = vram <= budget;
  const tight = !fits && vram <= (ramGB || 4) * 1024;
  return { fits, tight };
}

function Dot({ tone = "mute" }) {

  return <span className={`w-1.5 h-1.5 rounded-full ${colors[tone]}`} />;
}

function Modal({ open, onClose, title, subtitle, children, width = "max-w-2xl" }) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70" onClick={onClose} />
      <div className={`relative z-10 w-full ${width} max-h-[84vh] flex flex-col bg-bg border border-line`}>
        <div className="flex items-start justify-between px-4 py-3 border-b border-line">

            {subtitle && <div className="font-mono text-[11px] text-mute mt-0.5">{subtitle}</div>}
          </div>
          <button onClick={onClose} className="font-mono text-[11px] text-mute hover:text-text border border-line px-2 py-1">
            esc
          </button>
        </div>
        <div className="flex-1 overflow-y-auto min-h-0">{children}</div>
      </div>
    </div>
  );
}

      <Badge tone={system.webgpu ? "ok" : "err"}>
        <Dot tone={system.webgpu ? "ok" : "err"} /> WebGPU {system.webgpu ? "ok" : "absent"}
      </Badge>
      <Badge tone={ramTone}>RAM ≥{system.deviceMemoryGB} GB</Badge>

function ThreadItem({ thread, active, onSelect, onDelete, onRename }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(thread.title);
  const commit = () => { onRename(thread.id, draft.trim() || thread.title); setEditing(false); };
  return (
    <div
      onClick={() => onSelect(thread.id)}
      className={`group px-2.5 py-2 cursor-pointer border-l-2 transition-colors ${
        active ? "border-accent bg-accent/5" : "border-transparent hover:bg-surface2"
      }`}
    >
      <div className="flex items-center gap-2">
        <div className="flex-1 min-w-0">
          {editing ? (
            <input
              autoFocus value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onBlur={commit}
              onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
              onClick={(e) => e.stopPropagation()}
              className="w-full bg-bg border border-accent/50 px-1.5 py-0.5 text-[12.5px] text-text focus:outline-none"
            />
          ) : (
            <div
              className="text-[12.5px] truncate text-text/90"
              onDoubleClick={(e) => { e.stopPropagation(); setDraft(thread.title); setEditing(true); }}
              title="Double-click to rename"
            >
              {thread.title}
            </div>
          )}
          <div className="font-mono text-[10px] text-mute mt-0.5 truncate">
            {shortenId(thread.model)} · {thread.updatedAt}
          </div>
        </div>
        {!editing && (
          <div className="opacity-0 group-hover:opacity-100 flex items-center gap-0.5 shrink-0">
            <button
              onClick={(e) => { e.stopPropagation(); setDraft(thread.title); setEditing(true); }}
              className="font-mono text-[10px] text-mute hover:text-text px-1"
              title="Rename"

            <button
              onClick={(e) => { e.stopPropagation(); onDelete(thread.id); }}

          </div>

}

/* ============ chat: message rendering ============ */

// Minimal markdown: splits on ``` fences; **bold** and `inline code` in text.
function renderInline(text) {
  const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  return parts.map((p, i) => {
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={i} className="text-text font-semibold">{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={i} className="font-mono text-[12px] bg-surface2 border border-line rounded px-1 py-0.5 text-accent">{p.slice(1, -1)}</code>;
    return <span key={i}>{p}</span>;
  });
}

function CodeBlock({ lang, code }) {
  return (
    <div className="my-2 border border-line rounded-lg overflow-hidden bg-[#0d0d0d]">
      <div className="flex items-center justify-between px-3 py-1.5 border-b border-line bg-surface">
        <span className="font-mono text-[10px] text-mute uppercase tracking-wider">{lang || "code"}</span>
        <button className="font-mono text-[10px] text-mute hover:text-text">copy</button>
      </div>
      <pre className="px-3 py-2.5 overflow-x-auto"><code className="font-mono text-[12.5px] text-text leading-relaxed">{code}</code></pre>
    </div>
  );
}

function MessageBody({ content }) {
  const segments = content.split(/```/);
  return (
    <div className="text-[13.5px] text-text leading-relaxed">
      {segments.map((seg, i) => {
        if (i % 2 === 1) {
          const nl = seg.indexOf("\n");
          const lang = nl > -1 ? seg.slice(0, nl).trim() : "";
          const code = nl > -1 ? seg.slice(nl + 1).replace(/\n$/, "") : seg;
          return <CodeBlock key={i} lang={lang} code={code} />;
        }
        return <span key={i} className="whitespace-pre-wrap break-words">{renderInline(seg)}</span>;
      })}
    </div>
  );
}

function UsageInline({ usage }) {
  return (
    <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 font-mono text-[10px] text-mute border-t border-line/60 pt-1.5">
      <span>{usage.prompt} prompt tok</span>
      <span>{usage.completion} completion tok</span>
      <span className="text-mute/70">prefill {usage.prefill} tok/s</span>
      <span className="text-mute/70">decode {usage.decode} tok/s</span>
    </div>
  );
}

function MessageView({ message, modelId, streaming, isLast, onRegenerate }) {

          {message.at && <span className="text-[10px] font-mono text-mute/60">{message.at}</span>}
        </div>

        {isUser ? (
          <div className="inline-block max-w-full bg-surface2 border border-line rounded-lg rounded-tl-sm px-3 py-2">
            <MessageBody content={message.content} />
          </div>
        ) : (
          <div className="pr-2">
            <MessageBody content={message.content} />
            {streaming && <span className="inline-block w-1.5 h-3.5 bg-accent ml-0.5 align-middle blink" />}
          </div>

        {!isUser && !streaming && (message.usage || isLast) && (
          <div className="mt-1.5 flex items-center gap-1">

              <button

/* ============ chat: prompt hints + composer ============ */

function PromptHints({ query, templates, onPick }) {
  const matches = templates.filter((t) => t.title.toLowerCase().includes(query.toLowerCase()));
  if (matches.length === 0) return null;
  return (
    <div className="absolute bottom-full left-0 right-0 mb-1.5 border border-line bg-surface max-h-52 overflow-y-auto">
      <div className="px-3 py-1.5 border-b border-line font-mono text-[10px] text-mute uppercase tracking-widest">prompt templates</div>
      {matches.map((t, i) => (
        <button key={t.id} onClick={() => onPick(t)} className={`w-full text-left px-3 py-2 flex items-center justify-between ${i === 0 ? "bg-accent/5" : "hover:bg-surface2"}`}>
          <div className="min-w-0">
            <div className="font-mono text-[12px] text-text">/{t.title}</div>
            <div className="font-mono text-[10px] text-mute truncate">{t.content.replace(/\n/g, " ").trim()}</div>
          </div>
          {t.isBuiltIn && <span className="font-mono text-[9px] text-mute shrink-0 ml-2">built-in</span>}
        </button>
      ))}
    </div>
  );
}

function Composer({ modelReady, model, generating, templates, onSend, onStop, onParams, onClearContext }) {
  const [input, setInput] = useState("");
  const [images, setImages] = useState(0);
  const taRef = useRef(null);

  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 180) + "px";
  }, [input]);

  const hintQuery = input.startsWith("/") && input.length < 40 && !input.includes("\n") ? input.slice(1) : null;

  const send = () => {
    if (!input.trim() || !modelReady || generating) return;
    onSend(input.trim(), images);
    setInput(""); setImages(0);
  };

  return (
    <div className="border-t border-line bg-bg">
      <div className="max-w-3xl mx-auto px-6 py-3">
        {images > 0 && (
          <div className="flex gap-2 mb-2">
            {Array.from({ length: images }).map((_, i) => (
              <div key={i} className="relative group">
                <div className="w-16 h-16 border border-line bg-surface2 flex items-center justify-center font-mono text-[9px] text-mute">img {i + 1}</div>
                <button onClick={() => setImages((n) => n - 1)} className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-err text-bg text-[10px] leading-none flex items-center justify-center">×</button>
              </div>
            ))}
          </div>
        )}
        <div className="relative">
          {hintQuery !== null && <PromptHints query={hintQuery} templates={templates} onPick={(t) => setInput(t.content)} />}
          <div className="flex items-end gap-2">
            <textarea
              ref={taRef} value={input} onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey && hintQuery === null) { e.preventDefault(); send(); } }}
              rows={1} disabled={!modelReady}
              placeholder={modelReady ? "Type a message — / for templates, Enter to send" : "Load a model to begin"}
              className="flex-1 resize-none bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[14px] text-text placeholder:text-mute disabled:opacity-40"
              style={{ maxHeight: "180px" }}
            />
            {modelReady && (
              <button onClick={() => setImages((n) => Math.min(n + 1, 3))} disabled={images >= 3} title="Attach image"
                className="px-2.5 py-2 border border-line text-mute hover:text-text hover:bg-surface2 disabled:opacity-30">
                <Icon name="image" size={16} />
              </button>
            )}
            {generating ? (
              <button onClick={onStop} className="font-mono text-[12px] px-3 py-2 border border-err/60 text-err hover:bg-err/10">stop</button>
            ) : (
              <button onClick={send} disabled={!modelReady || !input.trim()}
                className="flex items-center gap-1 font-mono text-[12px] px-3 py-2 border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-30">
                send <Icon name="send" size={14} />
              </button>
            )}
          </div>
        </div>
        <div className="mt-2 flex items-center justify-between font-mono text-[10px] text-mute">
          <div className="flex items-center gap-3">
            <span>{modelReady ? `model · ${shortenId(model)}` : "no model loaded"}</span>
            <button onClick={onClearContext} disabled={!modelReady} className="hover:text-text disabled:opacity-30">clear context</button>
          </div>
          <button onClick={onParams} className="hover:text-text" disabled={!modelReady}>thread parameters →</button>
        </div>
      </div>
    </div>
  );
}

function ChatPage({ thread, messages, model, modelReady, generating, templates, onSend, onStop, onOpenPicker, onParams, onRegenerate, onClearContext, onChangeSystemPrompt }) {
  const scrollRef = useRef(null);
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  return (
    <div className="flex flex-col h-full min-h-0 flex-1">
      <div ref={scrollRef} className="flex-1 overflow-y-auto grid-bg">
        <div className="max-w-3xl mx-auto px-6 py-5">
          {thread && <SystemPromptBar value={thread.systemPrompt} onChange={onChangeSystemPrompt} />}
        </div>
        {messages.length === 0 ? (
          <EmptyState onOpenPicker={onOpenPicker} modelReady={modelReady} model={model} />
        ) : (
          <div className="max-w-3xl mx-auto px-6 pb-6 space-y-5">
            {messages.map((m, i) =>
              m.divider ? (
                <ContextDivider key={i} />
              ) : (
                <MessageView
                  key={i}
                  message={m}
                  modelId={model}
                  streaming={generating && i === messages.length - 1 && m.role === "assistant"}
                  isLast={i === messages.length - 1}
                  onRegenerate={onRegenerate}
                />
              ),
            )}
          </div>
        )}
      </div>
      <Composer
        modelReady={modelReady} model={model} generating={generating} templates={templates}
        onSend={onSend} onStop={onStop} onParams={onParams} onClearContext={onClearContext}
      />
    </div>
  );
}

/* ============ model picker ============ */

function ParamSlider({ label, value, min, max, step, onChange }) {
  return (
    <div className="flex items-center gap-3">
      <label className="font-mono text-[11px] text-mute w-28 shrink-0">{label}</label>
      <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 h-1 accent-accent" />

    </div>
  );
}

function ParamControls({ params, setParams }) {
  const set = (k) => (v) => setParams((p) => ({ ...p, [k]: v }));
  return (
    <div className="space-y-2.5">
      <ParamSlider label="temperature" value={params.temperature} min={0} max={2} step={0.05} onChange={set("temperature")} />
      <ParamSlider label="top_p" value={params.topP} min={0} max={1} step={0.05} onChange={set("topP")} />
      <ParamSlider label="max_tokens" value={params.maxTokens} min={64} max={16384} step={64} onChange={set("maxTokens")} />
      <ParamSlider label="presence_pen" value={params.presencePenalty} min={-2} max={2} step={0.1} onChange={set("presencePenalty")} />
      <ParamSlider label="frequency_pen" value={params.frequencyPenalty} min={-2} max={2} step={0.1} onChange={set("frequencyPenalty")} />
    </div>
  );
}

function StatusPanel({ engineState, progress }) {
  if (engineState === "idle") return null;
  const isLoading = engineState === "loading";
  const isError = engineState === "error";
  const pct = Math.round(progress.value * 100);
  return (
    <div className={`border-l-2 ${isError ? "border-err" : isLoading ? "border-accent" : "border-ok"} bg-surface px-3 py-2.5`}>
      <div className="flex items-center justify-between mb-1">
        <div className="font-mono text-[10px] uppercase tracking-widest text-mute">{isLoading ? "loading" : isError ? "error" : "ready"}</div>
        {isLoading && <div className="font-mono text-[11px] text-accent">{pct}%</div>}
      </div>
      <div className={`font-mono text-[11px] ${isError ? "text-err" : "text-text"} leading-snug break-words`}>{progress.text}</div>
      {isLoading && (
        <div className="mt-2 h-1 bg-bg border border-line overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{ width: `${pct}%` }} />
        </div>
      )}
    </div>
  );
}

function FamilyChip({ family, active, onClick }) {
  return (
    <button onClick={onClick}
      className={`flex items-center gap-1.5 pl-1.5 pr-3 py-1.5 rounded-full border text-[12px] transition-colors ${
        active ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:border-lineHi hover:text-text"
      }`}>
      <BrandLogo brand={BRAND[family]} size={17} />
      {family}
    </button>
  );
}

function ModelGridCard({ model, system, loadedId, recommended, engineState, onLoad, onUnload, onEvict }) {
  const [open, setOpen] = useState(false);
  const anyLoaded = model.variants.some((v) => v.id === loadedId);
  const anyCached = model.variants.some((v) => v.cached);
  const minVram = Math.min(...model.variants.map((v) => v.vram));
  const fit = fitFor(minVram, system.deviceMemoryGB);
  return (
    <div className={`rounded-xl border overflow-hidden self-start transition-colors ${anyLoaded ? "border-accent/60 bg-accent/[0.07]" : "border-line bg-surface hover:border-lineHi"}`}>
      <button onClick={() => setOpen((o) => !o)} className="w-full flex items-center gap-2.5 px-3 py-2.5 text-left">
        <BrandLogo brand={BRAND[model.family]} size={22} />
        <div className="flex-1 min-w-0">
          <div className="text-[12.5px] text-text truncate leading-tight">{model.name}</div>
          <div className="font-mono text-[10px] mt-0.5 flex items-center gap-1 whitespace-nowrap overflow-hidden">
            <span className="text-mute">{fmtMB(minVram)}{model.variants.length > 1 ? ` · ${model.variants.length} var` : ""}</span>
            {recommended && !anyLoaded && <span className="text-accent">· recommended</span>}
            {!fit.fits && !fit.tight && <span className="text-err">· too large</span>}
            {fit.tight && <span className="text-warn">· tight</span>}
          </div>
        </div>
        {anyLoaded && <Badge tone="accent">loaded</Badge>}
        {!anyLoaded && anyCached && <Dot tone="ok" />}
        <span className="text-mute"><Chevron open={open} /></span>
      </button>
      {open && (
        <div className="border-t border-line">
          {model.variants.map((v) => {
            const vf = fitFor(v.vram, system.deviceMemoryGB);
            const loaded = v.id === loadedId;
            return (
              <div key={v.id} className="flex items-center gap-1.5 px-3 py-2 border-t border-line/50 first:border-t-0 bg-bg/30">
                <span className="font-mono text-[10px] text-mute uppercase w-12 shrink-0">{v.quant}</span>
                <span className="font-mono text-[10px] text-mute w-12 shrink-0">{fmtMB(v.vram)}</span>
                <div className="flex-1 min-w-0 flex gap-1 overflow-hidden">
                  {loaded && <Badge tone="accent">loaded</Badge>}
                  {v.cached && !loaded && <Badge tone="ok">cached</Badge>}
                  {!vf.fits && !vf.tight && !loaded && <Badge tone="err">too large</Badge>}
                  {vf.tight && !loaded && <Badge tone="warn">tight</Badge>}
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  {loaded ? (
                    <button onClick={onUnload} className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-line text-mute hover:text-text">unload</button>
                  ) : (
                    <button onClick={() => onLoad(v.id)} disabled={engineState === "loading"}
                      className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-40">
                      {v.cached ? "load" : "download"}
                    </button>
                  )}
                  {v.cached && (
                    <button onClick={() => onEvict(v.id)} className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-line text-mute hover:text-err hover:border-err/40">evict</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ModelPicker({ open, onClose, system, loadedModel, engineState, progress, defaultParams, setDefaultParams, onLoad, onUnload, onEvict, onAddCustom }) {
  const [search, setSearch] = useState("");
  const [family, setFamily] = useState(null);
  const [hideTooLarge, setHideTooLarge] = useState(true);
  const [showParams, setShowParams] = useState(false);

  const families = useMemo(() => FAMILY_ORDER.filter((f) => MOCK_MODELS.some((m) => m.family === f)), []);
  const totalVariants = useMemo(() => MOCK_MODELS.reduce((n, m) => n + m.variants.length, 0), []);
  const minVramOf = (m) => Math.min(...m.variants.map((v) => v.vram));

  const recommendedName = useMemo(() => {
    const sorted = [...MOCK_MODELS].sort((a, b) => minVramOf(a) - minVramOf(b));
    const r = sorted.find((m) => fitFor(minVramOf(m), system.deviceMemoryGB).fits);
    return r ? r.name : null;
  }, [system]);

  const filtered = useMemo(() => {
    let list = MOCK_MODELS;
    if (family) list = list.filter((m) => m.family === family);
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter((m) => m.name.toLowerCase().includes(q) || m.family.toLowerCase().includes(q));
    }
    if (hideTooLarge) {
      list = list.filter((m) => m.variants.some((v) => {
        const f = fitFor(v.vram, system.deviceMemoryGB);
        return f.fits || f.tight || v.cached || v.id === loadedModel;
      }));
    }
    return [...list].sort((a, b) => minVramOf(a) - minVramOf(b));
  }, [search, family, hideTooLarge, system, loadedModel]);

  return (
    <Modal open={open} onClose={onClose} title="Model selection"
      subtitle={`${filtered.length} models · ${totalVariants} variants · runs in-browser via WebLLM`} width="max-w-4xl">
      <div className="px-4 py-3 border-b border-line space-y-3 sticky top-0 bg-bg z-10">
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-mute"><Icon name="search" size={15} /></span>
          <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search models…"
            className="w-full bg-surface border border-line rounded-lg focus:border-accent/60 focus:outline-none pl-9 pr-3 py-2 text-[13px]" />
        </div>
        <div className="flex flex-wrap gap-1.5">
          <button onClick={() => setFamily(null)}
            className={`px-3 py-1.5 rounded-full border text-[12px] transition-colors ${family === null ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:text-text"}`}>
            All
          </button>
          {families.map((f) => <FamilyChip key={f} family={f} active={family === f} onClick={() => setFamily(family === f ? null : f)} />)}
        </div>
        <div className="flex items-center justify-between">
          <label className="flex items-center gap-2 font-mono text-[11px] text-mute cursor-pointer">
            <input type="checkbox" checked={hideTooLarge} onChange={(e) => setHideTooLarge(e.target.checked)} className="accent-accent" />
            hide models too large for this device
          </label>
          <button onClick={onAddCustom} className="font-mono text-[11px] text-mute hover:text-accent border border-line rounded-md px-2 py-1">+ custom model</button>
        </div>
        <StatusPanel engineState={engineState} progress={progress} />
      </div>

      <div className="p-4">
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 items-start">
          {filtered.map((m) => (
            <ModelGridCard key={m.name} model={m} system={system} loadedId={loadedModel}
              recommended={m.name === recommendedName} engineState={engineState}
              onLoad={onLoad} onUnload={onUnload} onEvict={onEvict} />
          ))}
        </div>
        {filtered.length === 0 && <div className="font-mono text-[12px] text-mute text-center py-12">No models match your search.</div>}
      </div>

      <div className="border-t border-line">
        <button onClick={() => setShowParams((s) => !s)} className="w-full flex items-center justify-between px-4 py-2.5 font-mono text-[11px] text-mute hover:text-text">
          <span>default generation parameters</span>
          <span>{showParams ? "−" : "+"}</span>
        </button>
        {showParams && (
          <div className="px-4 pb-4">
            <ParamControls params={defaultParams} setParams={setDefaultParams} />
            <div className="font-mono text-[10px] text-mute mt-2.5">Applied to new threads. Per-thread overrides live in thread parameters.</div>
          </div>
        )}
      </div>
    </Modal>
  );
}

function SettingsModal({ open, onClose, templates, setTemplates, defaultParams, setDefaultParams }) {
  const [tab, setTab] = useState("templates");
  const [draft, setDraft] = useState({ title: "", content: "" });

  const addTemplate = () => {
    if (!draft.title.trim()) return;
    setTemplates((t) => [...t, { id: "u" + Date.now(), title: draft.title.trim(), content: draft.content, isBuiltIn: false }]);
    setDraft({ title: "", content: "" });
  };

  const tabs = [["templates", "Prompt templates"], ["params", "Default parameters"], ["about", "About"]];

  return (
    <Modal open={open} onClose={onClose} title="Settings">
      <div className="flex border-b border-line">
        {tabs.map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={`font-mono text-[11px] px-4 py-2.5 border-r border-line ${tab === id ? "text-accent bg-accent/5" : "text-mute hover:text-text"}`}>
            {label}
          </button>
        ))}
      </div>

      {tab === "templates" && (
        <div className="p-4 space-y-4">

            {templates.map((t) => (
              <div key={t.id} className="group flex items-center gap-2 border border-line bg-surface px-3 py-2">
                <div className="flex-1 min-w-0">
                  <div className="font-mono text-[12px] text-text">/{t.title}</div>
                  <div className="font-mono text-[10px] text-mute truncate">{t.content.replace(/\n/g, " ").trim()}</div>
                </div>
                {t.isBuiltIn ? (
                  <span className="font-mono text-[9px] text-mute shrink-0">built-in</span>
                ) : (
                  <button onClick={() => setTemplates((arr) => arr.filter((x) => x.id !== t.id))}
                    className="opacity-0 group-hover:opacity-100 font-mono text-[11px] text-mute hover:text-err shrink-0">delete</button>
                )}
              </div>
            ))}
          </div>
          <div className="border-t border-line pt-4 space-y-2">
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest">new template</div>
            <input value={draft.title} onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))} placeholder="Title (used as /trigger)"
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-1.5 text-[12px] font-mono" />
            <textarea value={draft.content} onChange={(e) => setDraft((d) => ({ ...d, content: e.target.value }))} placeholder="Template content inserted into the composer…" rows={3}
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[12px] resize-none" />
            <button onClick={addTemplate} className="font-mono text-[11px] px-3 py-1.5 border border-accent/60 text-accent hover:bg-accent/10">+ add template</button>
          </div>
        </div>
      )}

      {tab === "params" && (
        <div className="p-4 space-y-3">
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest">global default parameters</div>
          <ParamControls params={defaultParams} setParams={setDefaultParams} />
          <div className="font-mono text-[10px] text-mute border-t border-line pt-3">New threads inherit these. Each thread can override them independently.</div>
        </div>
      )}

      {tab === "about" && (
        <div className="p-4 space-y-3 text-[12px] text-mute leading-relaxed">
          <div className="font-mono text-sm text-text">ht[LLM]</div>
          <p>A fully client-side WebGPU chat app. No server, no telemetry. Threads, messages, documents, settings and API keys live only in this browser's IndexedDB.</p>
          <div className="font-mono text-[11px] border-t border-line pt-3 space-y-1">
            <div><span className="text-mute">runtime</span> · WebLLM · WebGPU</div>
            <div><span className="text-mute">storage</span> · IndexedDB (local only)</div>
            <div><span className="text-mute">providers</span> · WebLLM now · Ollama / Groq / OpenRouter next</div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function StorageBar({ used, total }) {
  const pct = Math.min(100, Math.round((used / total) * 100));
  return (
    <div>
      <div className="flex items-center justify-between font-mono text-[11px] text-mute mb-1">
        <span>{fmtBytes(used)} used</span>
        <span>{fmtBytes(total)} quota</span>

        <div className="h-full bg-accent" style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

function StoragePage({ system, models, loadedModel, onEvict }) {
  const cached = [];
  models.forEach((m) => m.variants.forEach((v) => { if (v.cached) cached.push({ ...v, family: m.family, name: m.name }); }));
  const cacheBytes = cached.reduce((n, v) => n + v.vram * 1024 ** 2, 0);
  const idbBytes = 6.2 * 1024 ** 2;
  const docBytes = MOCK_DOCS.reduce((n, d) => n + d.size, 0);
  const used = cacheBytes + idbBytes + docBytes;

  return (
    <div className="flex-1 overflow-y-auto grid-bg">
      <div className="max-w-3xl mx-auto px-6 py-8 space-y-7">
        <div>
          <div className="mb-1 font-mono text-[10px] text-accent uppercase tracking-widest">storage</div>
          <h1 className="text-xl font-medium mb-3">Data &amp; cache</h1>
          <StorageBar used={used} total={system.storage.quota} />
          <div className="mt-2 flex gap-4 font-mono text-[10px] text-mute">
            <span><span className="text-accent">■</span> model cache {fmtBytes(cacheBytes)}</span>
            <span><span className="text-text">■</span> app data {fmtBytes(idbBytes)}</span>
            <span><span className="text-mute">■</span> documents {fmtBytes(docBytes)}</span>
          </div>
        </div>

        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">cached model weights · {cached.length}</div>
          <div className="space-y-1">
            {cached.map((v) => (
              <div key={v.id} className="flex items-center gap-3 border border-line bg-surface rounded-lg px-3 py-2.5">
                <BrandLogo brand={BRAND[v.family]} size={20} />
                <div className="flex-1 min-w-0">
                  <div className="text-[12.5px] text-text truncate">{shortenId(v.id)}</div>
                  <div className="font-mono text-[10px] text-mute">{v.quant} · {fmtMB(v.vram)}{v.id === loadedModel ? " · loaded" : ""}</div>
                </div>
                <button onClick={() => onEvict(v.id)} className="font-mono text-[10px] px-2 py-1 rounded-md border border-line text-mute hover:text-err hover:border-err/40">evict</button>
              </div>
            ))}
            {cached.length === 0 && <div className="font-mono text-[11px] text-mute">No models cached.</div>}
          </div>
        </section>

        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">application data</div>
          <div className="border border-line bg-surface rounded-lg divide-y divide-line">
            {[
              ["Threads", "3 conversations"],
              ["Messages", "47 messages"],
              ["Prompt templates", "5 templates"],
              ["Provider keys", "0 stored"],
            ].map(([k, v]) => (
              <div key={k} className="flex items-center justify-between px-3 py-2">
                <span className="text-[12.5px] text-text">{k}</span>
                <span className="font-mono text-[11px] text-mute">{v}</span>
              </div>
            ))}

          <div className="mt-2 flex gap-2">
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-text hover:border-accent/50 hover:text-accent">export all ↓</button>
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-text hover:border-accent/50 hover:text-accent">import ↑</button>
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-mute hover:text-err hover:border-err/40">clear all data</button>
          </div>
        </section>

        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">documents · {MOCK_DOCS.length}</div>
          <div className="space-y-1">
            {MOCK_DOCS.map((d) => (
              <div key={d.id} className="group flex items-center gap-3 border border-line bg-surface rounded-lg px-3 py-2.5">
                <Icon name="doc" size={16} />
                <div className="flex-1 min-w-0">
                  <div className="text-[12.5px] text-text truncate">{d.name}</div>
                  <div className="font-mono text-[10px] text-mute">{d.chunks} chunks · {fmtBytes(d.size)}</div>
                </div>
                <button className="opacity-0 group-hover:opacity-100 text-mute hover:text-err"><Icon name="trash" size={14} /></button>
              </div>
            ))}
          </div>
        </section>
      </div>
    </div>
  );
}

/* ============ prototype stage switcher ============ */

function StageBar({ stage, setStage }) {
  const stages = [["landing", "Landing"], ["app", "App"], ["noGPU", "No WebGPU"]];
  return (
    <div className="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 border border-line bg-surface px-1.5 py-1.5 stripe">
      <span className="font-mono text-[9px] text-mute uppercase tracking-widest px-1.5">prototype</span>
      {stages.map(([id, label]) => (
        <button key={id} onClick={() => setStage(id)}
          className={`font-mono text-[10px] px-2 py-1 border ${stage === id ? "border-accent/60 text-accent bg-accent/10" : "border-line text-mute hover:text-text"}`}>
          {label}
        </button>
      ))}
    </div>
  );
}

/* ============ app ============ */

const DEFAULT_PARAMS = { temperature: 1.0, topP: 1.0, maxTokens: 4000, presencePenalty: 0, frequencyPenalty: 0 };

function App() {
  const [stage, setStage] = useState("landing");
  const [page, setPage] = useState("chat");

  const [threads, setThreads] = useState(MOCK_THREADS);
  const [messagesByThread, setMessagesByThread] = useState(MOCK_MESSAGES);
  const [activeThread, setActiveThread] = useState("th1");
  const [templates, setTemplates] = useState(MOCK_TEMPLATES);

  const [engineState, setEngineState] = useState("ready");
  const [loadedModel, setLoadedModel] = useState("Llama-3.2-1B-Instruct-q4f16_1-MLC");
  const [progress, setProgress] = useState({ value: 1, text: "Llama-3.2-1B-Instruct loaded" });

  const [defaultParams, setDefaultParams] = useState(DEFAULT_PARAMS);
  const [threadParams, setThreadParams] = useState(DEFAULT_PARAMS);

  const [modal, setModal] = useState(null);
  const [generating, setGenerating] = useState(false);

  const thread = threads.find((t) => t.id === activeThread) || null;
  const messages = messagesByThread[activeThread] || [];
  const modelReady = engineState === "ready" && !!loadedModel;

  const loadModel = (id) => {
    setEngineState("loading");
    let v = 0;
    setProgress({ value: 0, text: "Initializing engine…" });
    const timer = setInterval(() => {
      v += 0.16 + Math.random() * 0.12;
      if (v >= 1) {
        clearInterval(timer);
        setProgress({ value: 1, text: shortenId(id) + " loaded" });
        setEngineState("ready");
        setLoadedModel(id);
      } else {
        setProgress({ value: v, text: `Fetching weights · ${shortenId(id)}` });
      }
    }, 300);
  };
  const unloadModel = () => { setEngineState("idle"); setLoadedModel(null); setProgress({ value: 0, text: "" }); };
  const evictModel = (id) => {
    MOCK_MODELS.forEach((m) => { const v = m.variants.find((x) => x.id === id); if (v) v.cached = false; });
    if (id === loadedModel) unloadModel();
    setThreads((t) => [...t]);
  };

  const newThread = () => {
    const id = "th" + Date.now();
    setThreads((t) => [{ id, title: "New thread", model: loadedModel || "", updatedAt: "now", systemPrompt: DEFAULT_SYS_PROMPT }, ...t]);
    setMessagesByThread((m) => ({ ...m, [id]: [] }));
    setActiveThread(id);
    setPage("chat");
  };
  const deleteThread = (id) => {
    setThreads((t) => t.filter((x) => x.id !== id));
    if (activeThread === id) {
      const rest = threads.filter((x) => x.id !== id);
      setActiveThread(rest[0] ? rest[0].id : null);
    }
  };
  const renameThread = (id, title) => setThreads((t) => t.map((x) => (x.id === id ? { ...x, title } : x)));
  const setSystemPrompt = (sp) => setThreads((t) => t.map((x) => (x.id === activeThread ? { ...x, systemPrompt: sp } : x)));
  const clearContext = () =>
    setMessagesByThread((m) => ({ ...m, [activeThread]: [...(m[activeThread] || []), { divider: true }] }));

  const send = (text, imageCount) => {
    const userMsg = { role: "user", content: text, at: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) };
    if (imageCount > 0) userMsg.images = imageCount;
    const reply =
      "This is a mock streamed response for the UI prototype. Real generation runs on your GPU via WebLLM. Here's a sample code block so the rendering can be reviewed:\n\n```js\nconst engine = await CreateMLCEngine(modelId);\nconst reply = await engine.chat.completions.create({ messages });\n```\n\nThe **hybrid** message style, avatars, timestamps and collapsible stats are all visible here.";
    setMessagesByThread((m) => ({ ...m, [activeThread]: [...(m[activeThread] || []), userMsg, { role: "assistant", content: "", at: userMsg.at }] }));
    setGenerating(true);
    let shown = 0;
    const timer = setInterval(() => {
      shown += 5;
      const done = shown >= reply.length;
      setMessagesByThread((m) => {
        const arr = [...(m[activeThread] || [])];
        arr[arr.length - 1] = {
          role: "assistant", at: userMsg.at, content: reply.slice(0, shown),
          usage: done ? { prompt: 44, completion: 92, prefill: 401.2, decode: 73.5 } : undefined,
        };
        return { ...m, [activeThread]: arr };
      });
      if (done) {
        clearInterval(timer);
        setGenerating(false);
        setThreads((t) => t.map((x) => (x.id === activeThread && x.title === "New thread" ? { ...x, title: text.slice(0, 40) } : x)));
      }
    }, 55);
  };

  const regenerate = () => {
    setMessagesByThread((m) => {
      const arr = [...(m[activeThread] || [])];
      while (arr.length && arr[arr.length - 1].role === "assistant") arr.pop();
      return { ...m, [activeThread]: arr };
    });
    const last = [...messages].reverse().find((x) => x.role === "user");
    if (last) setTimeout(() => send(last.content, 0), 30);
  };

  if (stage === "landing") {
    return (
      <React.Fragment>
        <Landing onEnter={() => setStage("app")} />
        <StageBar stage={stage} setStage={setStage} />
      </React.Fragment>
    );
  }

  const noGPU = stage === "noGPU";
  const system = { ...MOCK_SYSTEM, webgpu: !noGPU };

  return (
    <React.Fragment>
      <div className="h-screen flex overflow-hidden">
        <NavRail page={page} setPage={setPage} onOpenSettings={() => setModal("settings")} />

        <div className="flex-1 flex flex-col min-w-0">
          <header className="border-b border-line bg-bg px-4 py-2 flex items-center justify-between gap-4">
            <SystemRail system={system} />
            <div className="font-mono text-[10px] text-mute hidden md:block">
              {noGPU ? "inference unavailable" : modelReady ? shortenId(loadedModel) : "no model"}
            </div>
          </header>

          {noGPU ? (
            <WebGPUBlock />
          ) : (
            <div className="flex-1 flex min-h-0">
              {page === "chat" && (
                <React.Fragment>
                  <Sidebar
                    threads={threads} activeId={activeThread} onSelect={setActiveThread}
                    onNew={newThread} onDelete={deleteThread} onRename={renameThread}
                    model={loadedModel} engineState={engineState} onOpenPicker={() => setModal("picker")}
                  />
                  {activeThread ? (
                    <ChatPage
                      thread={thread} messages={messages} model={loadedModel} modelReady={modelReady}
                      generating={generating} templates={templates}
                      onSend={send} onStop={() => setGenerating(false)}
                      onOpenPicker={() => setModal("picker")} onParams={() => setModal("params")}
                      onRegenerate={regenerate} onClearContext={clearContext} onChangeSystemPrompt={setSystemPrompt}
                    />
                  ) : (
                    <div className="flex-1 grid-bg flex items-center justify-center">
                      <button onClick={newThread} className="font-mono text-[12px] px-4 py-2 border border-accent/60 text-accent hover:bg-accent/10">+ new chat</button>
                    </div>
                  )}
                </React.Fragment>
              )}
              {page === "knowledge" && <KnowledgePage />}
              {page === "storage" && <StoragePage system={system} models={MOCK_MODELS} loadedModel={loadedModel} onEvict={evictModel} />}
            </div>
          )}
        </div>
      </div>

      <ModelPicker
        open={modal === "picker"} onClose={() => setModal(null)} system={system}
        loadedModel={loadedModel} engineState={engineState} progress={progress}
        defaultParams={defaultParams} setDefaultParams={setDefaultParams}
        onLoad={loadModel} onUnload={unloadModel} onEvict={evictModel} onAddCustom={() => setModal("custom")}
      />
      <SettingsModal
        open={modal === "settings"} onClose={() => setModal(null)}
        templates={templates} setTemplates={setTemplates}
        defaultParams={defaultParams} setDefaultParams={setDefaultParams}
      />
      <ThreadParams
        open={modal === "params"} onClose={() => setModal(null)}
        params={threadParams} setParams={setThreadParams} defaults={defaultParams}
        onReset={() => setThreadParams(defaultParams)}
      />
      <CustomModelModal open={modal === "custom"} onClose={() => setModal("picker")} />

      <StageBar stage={stage} setStage={setStage} />
    </React.Fragment>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
