/* ============ utils ============ */

function fmtMB(mb) {
  if (mb == null) return "—";
  if (mb < 1024) return `${Math.round(mb)} MB`;
  return `${(mb / 1024).toFixed(1)} GB`;
}
function fmtBytes(b) {
  if (b == null) return "—";
  const GB = 1024 ** 3;
  if (b >= GB) return `${(b / GB).toFixed(1)} GB`;
  return `${(b / 1024 ** 2).toFixed(0)} MB`;
}
function shortenId(id) {
  return (id || "").replace(/-MLC$/, "").replace(/-q\df\d+_\d+/, "");
}
function familyOf(modelId) {
  const m = MOCK_MODELS.find((x) => x.variants.some((v) => v.id === modelId));
  return m ? m.family : null;
}
function fitFor(vram, ramGB) {
  const budget = (ramGB || 4) * 1024 * 0.7;
  const fits = vram <= budget;
  const tight = !fits && vram <= (ramGB || 4) * 1024;
  return { fits, tight };
}

/* ============ syntax highlighter ============
   Small hand-rolled tokenizer. Not a full parser — covers JS/TS, Python,
   Rust, HTML, CSS, JSON, bash, shell, sql, go, c/c++, ruby reasonably.
   Returns an array of [class, text] pairs.
*/

const KW = {
  js:  /\b(const|let|var|function|return|if|else|for|while|do|break|continue|switch|case|default|new|this|class|extends|super|import|export|from|as|async|await|yield|try|catch|finally|throw|typeof|instanceof|in|of|delete|void|null|undefined)\b/,
  ts:  /\b(const|let|var|function|return|if|else|for|while|do|break|continue|switch|case|default|new|this|class|extends|super|import|export|from|as|async|await|yield|try|catch|finally|throw|typeof|instanceof|in|of|delete|void|null|undefined|interface|type|enum|namespace|readonly|public|private|protected|abstract|implements|keyof)\b/,
  py:  /\b(def|class|return|if|elif|else|for|while|break|continue|pass|import|from|as|with|try|except|finally|raise|lambda|yield|async|await|in|is|not|and|or|None|True|False|global|nonlocal)\b/,
  rs:  /\b(fn|let|mut|const|static|struct|enum|impl|trait|pub|use|mod|crate|self|Self|super|return|if|else|match|for|while|loop|break|continue|in|as|where|ref|move|async|await|dyn|box|unsafe|extern)\b/,
  go:  /\b(func|var|const|type|struct|interface|package|import|return|if|else|for|range|switch|case|default|break|continue|go|chan|defer|select|map|nil|true|false)\b/,
  c:   /\b(int|char|float|double|void|short|long|signed|unsigned|struct|enum|union|typedef|static|extern|const|volatile|return|if|else|for|while|do|switch|case|default|break|continue|sizeof|NULL|true|false)\b/,
  sh:  /\b(if|then|fi|else|elif|for|while|do|done|case|esac|in|function|return|export|local|readonly|echo|printf|read|cd|exit)\b/,
  sql: /\b(SELECT|FROM|WHERE|JOIN|INNER|LEFT|RIGHT|OUTER|ON|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|INDEX|VIEW|AS|AND|OR|NOT|NULL|IS|IN|EXISTS|DISTINCT|UNION|ALL|CASE|WHEN|THEN|ELSE|END)\b/i,
  rb:  /\b(def|end|class|module|do|return|if|elsif|else|unless|while|until|for|in|case|when|then|begin|rescue|ensure|raise|require|require_relative|attr_accessor|attr_reader|attr_writer|self|nil|true|false|and|or|not|yield)\b/,
};
const BOOL = /\b(true|false|null|undefined|None|True|False|nil|NULL)\b/;
const ALIAS = {
  javascript: "js", typescript: "ts", jsx: "js", tsx: "ts",
  python: "py", rust: "rs", golang: "go", "c++": "c", cpp: "c", "c#": "c",
  shell: "sh", bash: "sh", zsh: "sh", ruby: "rb",
};

function highlightCode(code, langRaw) {
  const lang = ALIAS[langRaw] || langRaw || "js";

  if (lang === "json") return highlightJSON(code);
  if (lang === "html" || lang === "xml") return highlightHTML(code);
  if (lang === "css")  return highlightCSS(code);

  const out = [];
  const kw = KW[lang] || KW.js;

  const patterns = [
    [/^\/\*[\s\S]*?\*\//, "tok-com"],
    [/^\/\/[^\n]*/, "tok-com"],
    [/^#[^\n]*/, "tok-com"],
    [/^"""[\s\S]*?"""/, "tok-str"],
    [/^'''[\s\S]*?'''/, "tok-str"],
    [/^`(?:\\.|\$\{[^}]*\}|[^`\\])*`/, "tok-str"],
    [/^"(?:\\.|[^"\\])*"/, "tok-str"],
    [/^'(?:\\.|[^'\\])*'/, "tok-str"],
    [/^\b\d+\.?\d*(?:e[+-]?\d+)?\b/i, "tok-num"],
    [BOOL, "tok-bool"],
    [kw, "tok-key"],
    [/^\b[A-Z][A-Za-z0-9_]*\b/, "tok-typ"],
    [/^\b[a-z_$][\w$]*(?=\s*\()/, "tok-fn"],
    [/^\b[a-zA-Z_$][\w$]*\b/, null],
    [/^[+\-*/%=<>!&|^~?:]+/, "tok-op"],
    [/^[{}[\]().,;]/, "tok-punc"],
    [/^\s+/, null],
    [/^./, null],
  ];

  let s = code;
  while (s.length) {
    let matched = false;
    for (const [re, cls] of patterns) {
      const m = s.match(re);
      if (m && m.index === 0 && m[0].length > 0) {
        out.push([cls, m[0]]);
        s = s.slice(m[0].length);
        matched = true;
        break;
      }
    }
    if (!matched) { out.push([null, s[0]]); s = s.slice(1); }
  }
  return out;
}

function highlightJSON(code) {
  const out = [];
  let s = code;
  while (s.length) {
    let m;
    if ((m = s.match(/^"(?:\\.|[^"\\])*"(?=\s*:)/))) { out.push(["tok-attr", m[0]]); }
    else if ((m = s.match(/^"(?:\\.|[^"\\])*"/))) { out.push(["tok-str", m[0]]); }
    else if ((m = s.match(/^-?\b\d+\.?\d*(?:e[+-]?\d+)?\b/i))) { out.push(["tok-num", m[0]]); }
    else if ((m = s.match(/^\b(true|false|null)\b/))) { out.push(["tok-bool", m[0]]); }
    else if ((m = s.match(/^[{}[\],:]/))) { out.push(["tok-punc", m[0]]); }
    else if ((m = s.match(/^\s+/))) { out.push([null, m[0]]); }
    else { out.push([null, s[0]]); s = s.slice(1); continue; }
    s = s.slice(m[0].length);
  }
  return out;
}

function highlightHTML(code) {
  const out = [];
  let s = code;
  const tagRe = /^<\/?([a-zA-Z][\w-]*)((?:\s+[a-zA-Z-]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|\{[^}]*\}|[^\s>]+))?)*)\s*\/?>/;
  while (s.length) {
    if (s.startsWith("<!--")) {
      const end = s.indexOf("-->");
      const stop = end === -1 ? s.length : end + 3;
      out.push(["tok-com", s.slice(0, stop)]); s = s.slice(stop); continue;
    }
    const m = s.match(tagRe);
    if (m) {
      const full = m[0];
      const isClose = full.startsWith("</");
      out.push(["tok-punc", isClose ? "</" : "<"]);
      out.push(["tok-tag", m[1]]);
      let attrs = m[2];
      while (attrs.length) {
        const a = attrs.match(/^\s+([a-zA-Z-]+)(\s*=\s*)("[^"]*"|'[^']*'|\{[^}]*\}|[^\s>]+)?/);
        if (!a) break;
        out.push([null, a[0].match(/^\s+/)[0]]);
        out.push(["tok-attr", a[1]]);
        if (a[2]) { out.push(["tok-op", a[2]]); out.push(["tok-str", a[3]]); }
        attrs = attrs.slice(a[0].length);
      }
      out.push(["tok-punc", full.endsWith("/>") ? "/>" : ">"]);
      s = s.slice(full.length); continue;
    }
    const next = s.indexOf("<");
    const stop = next === -1 ? s.length : next;
    out.push([null, s.slice(0, stop)]);
    s = s.slice(stop || 1);
  }
  return out;
}

function highlightCSS(code) {
  const out = [];
  let s = code;
  while (s.length) {
    let m;
    if ((m = s.match(/^\/\*[\s\S]*?\*\//))) { out.push(["tok-com", m[0]]); }
    else if ((m = s.match(/^"[^"]*"|^'[^']*'/))) { out.push(["tok-str", m[0]]); }
    else if ((m = s.match(/^-?\d+(?:\.\d+)?(?:px|em|rem|vh|vw|%|s|ms|deg)?/))) { out.push(["tok-num", m[0]]); }
    else if ((m = s.match(/^#[a-fA-F0-9]{3,8}/))) { out.push(["tok-num", m[0]]); }
    else if ((m = s.match(/^@[a-zA-Z-]+/))) { out.push(["tok-key", m[0]]); }
    else if ((m = s.match(/^[.#&][\w-]+/))) { out.push(["tok-typ", m[0]]); }
    else if ((m = s.match(/^[a-zA-Z-]+(?=\s*:)/))) { out.push(["tok-attr", m[0]]); }
    else if ((m = s.match(/^[{};:,()]/))) { out.push(["tok-punc", m[0]]); }
    else if ((m = s.match(/^\s+/))) { out.push([null, m[0]]); }
    else { out.push([null, s[0]]); s = s.slice(1); continue; }
    s = s.slice(m[0].length);
  }
  return out;
}

/* ============ atoms ============ */

function Badge({ tone = "neutral", children, mono = true }) {
  const tones = {
    neutral: "border-line text-mute",
    ok: "border-ok/40 text-ok bg-ok/5",
    warn: "border-warn/40 text-warn bg-warn/5",
    err: "border-err/40 text-err bg-err/5",
    accent: "border-accent/40 text-accent bg-accent/5",
    info: "border-info/40 text-info bg-info/5",
  };
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 text-[11px] border whitespace-nowrap ${tones[tone]} ${mono ? "font-mono" : ""}`}>
      {children}
    </span>
  );
}

function Dot({ tone = "mute" }) {
  const colors = { mute: "bg-mute", ok: "bg-ok", warn: "bg-warn", err: "bg-err", accent: "bg-accent" };
  return <span className={`w-1.5 h-1.5 rounded-full ${colors[tone]}`} />;
}

function Modal({ open, onClose, title, subtitle, children, width = "max-w-2xl" }) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70" onClick={onClose} />
      <div className={`relative z-10 w-full ${width} max-h-[84vh] flex flex-col bg-bg border border-line`}>
        <div className="flex items-start justify-between px-4 py-3 border-b border-line">
          <div>
            <h2 className="font-mono text-sm text-text">{title}</h2>
            {subtitle && <div className="font-mono text-[11px] text-mute mt-0.5">{subtitle}</div>}
          </div>
          <button onClick={onClose} className="font-mono text-[11px] text-mute hover:text-text border border-line px-2 py-1">
            esc
          </button>
        </div>
        <div className="flex-1 overflow-y-auto min-h-0">{children}</div>
      </div>
    </div>
  );
}

      {!compact && <Badge tone="neutral">buf {fmtBytes(system.gpu.maxBufferSize)}</Badge>}
      <Badge tone={storTone}>free {fmtBytes(system.storage.free)}</Badge>
      {!compact && <Badge tone="neutral">net {system.connection.effectiveType}</Badge>}

// Compact display of one model role (chat or embed). Click opens the picker.
function ModelSlot({ role, model, state, progress, onClick }) {
  const labels = { chat: "chat", embed: "embed" };
  const isReady = state === "ready" && !!model;
  const isLoading = state === "loading";
  const brand = model ? (role === "embed" ? (MOCK_EMBED_MODELS.find((m) => m.id === model)?.brand) : BRAND[familyOf(model)]) : null;
  const dot = isReady ? "ok" : isLoading ? "accent" : "mute";

  return (
    <button onClick={onClick}
      className={`group flex items-center gap-2 pl-1.5 pr-2.5 py-1 border transition-colors min-w-0 ${
        isReady ? "border-line bg-surface hover:border-lineHi" : "border-line bg-surface/60 hover:border-accent/50"

function ThreadItem({ thread, active, onSelect, onDelete, onRename }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(thread.title);
  const commit = () => { onRename(thread.id, draft.trim() || thread.title); setEditing(false); };
  return (
    <div
      onClick={() => onSelect(thread.id)}
      className={`group px-2.5 py-2 cursor-pointer border-l-2 transition-colors ${
        active ? "border-accent bg-accent/5" : "border-transparent hover:bg-surface2"
      }`}
    >
      <div className="flex items-center gap-2">
        <div className="flex-1 min-w-0">
          {editing ? (
            <input
              autoFocus value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onBlur={commit}
              onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
              onClick={(e) => e.stopPropagation()}
              className="w-full bg-bg border border-accent/50 px-1.5 py-0.5 text-[12.5px] text-text focus:outline-none"
            />
          ) : (
            <div
              className="text-[12.5px] truncate text-text/90"
              onDoubleClick={(e) => { e.stopPropagation(); setDraft(thread.title); setEditing(true); }}
              title="Double-click to rename"
            >
              {thread.title}
            </div>
          )}
          <div className="font-mono text-[10px] text-mute mt-0.5 truncate">
            {shortenId(thread.model)} · {thread.updatedAt}
          </div>
        </div>
        {!editing && (
          <div className="opacity-0 group-hover:opacity-100 flex items-center gap-0.5 shrink-0">
            <button
              onClick={(e) => { e.stopPropagation(); setDraft(thread.title); setEditing(true); }}
              className="p-1 text-mute hover:text-text"
              title="Rename"
            >
              <Icon name="pencil" size={13} />
            </button>
            <button
              onClick={(e) => { e.stopPropagation(); onDelete(thread.id); }}
              className="p-1 text-mute hover:text-err"
              title="Delete"
            >
              <Icon name="trash" size={13} />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Sidebar({ threads, activeId, onSelect, onNew, onDelete, onRename, model, engineState, onOpenPicker }) {

/* ============ chat: message rendering ============ */

function renderInline(text) {
  const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  return parts.map((p, i) => {
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={i} className="text-text font-semibold">{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={i} className="font-mono text-[12px] bg-surface2 border border-line rounded px-1 py-0.5 text-accent">{p.slice(1, -1)}</code>;
    return <span key={i}>{p}</span>;
  });
}

function CodeBlock({ lang, code }) {
  const [copied, setCopied] = useState(false);
  const tokens = useMemo(() => highlightCode(code, (lang || "").toLowerCase()), [code, lang]);
  const copy = () => {
    try { navigator.clipboard.writeText(code); } catch {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1200);
  };
  return (
    <div className="my-2 border border-line overflow-hidden bg-[#0d0d0d]">
      <div className="flex items-center justify-between px-3 py-1.5 border-b border-line bg-surface">
        <span className="font-mono text-[10px] text-mute uppercase tracking-wider">{lang || "code"}</span>
        <button onClick={copy} className="flex items-center gap-1 font-mono text-[10px] text-mute hover:text-text">
          {copied ? <><Icon name="check" size={11} /> copied</> : <><Icon name="copy" size={11} /> copy</>}
        </button>
      </div>
      <pre className="px-3 py-2.5 overflow-x-auto"><code className="font-mono text-[12.5px] text-text/90 leading-relaxed">
        {tokens.map(([cls, txt], i) => cls ? <span key={i} className={cls}>{txt}</span> : <span key={i}>{txt}</span>)}
      </code></pre>
    </div>
  );
}

function MessageBody({ content }) {
  const segments = content.split(/```/);
  return (
    <div className="text-[13.5px] text-text leading-relaxed">
      {segments.map((seg, i) => {
        if (i % 2 === 1) {
          const nl = seg.indexOf("\n");
          const lang = nl > -1 ? seg.slice(0, nl).trim() : "";
          const code = nl > -1 ? seg.slice(nl + 1).replace(/\n$/, "") : seg;
          return <CodeBlock key={i} lang={lang} code={code} />;
        }
        return <span key={i} className="whitespace-pre-wrap break-words">{renderInline(seg)}</span>;
      })}
    </div>
  );
}

function UsageInline({ usage }) {
  return (
    <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 font-mono text-[10px] text-mute border-t border-line/60 pt-1.5">
      <span>{usage.prompt} prompt tok</span>
      <span>{usage.completion} completion tok</span>
      <span className="text-mute/70">prefill {usage.prefill} tok/s</span>
      <span className="text-mute/70">decode {usage.decode} tok/s</span>
    </div>
  );
}

function MessageView({ message, modelId, streaming, isLast, onRegenerate }) {
  const [showUsage, setShowUsage] = useState(false);
  const isUser = message.role === "user";
  return (
    <div className="flex gap-3">
      <Avatar role={message.role} modelId={modelId} />
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 mb-1 overflow-hidden">
          <span className="text-[11px] font-mono text-text/80 whitespace-nowrap">{isUser ? "You" : shortenId(modelId) || "Assistant"}</span>
          {message.at && <span className="text-[10px] font-mono text-mute/60 shrink-0">{message.at}</span>}
        </div>

        {isUser ? (
          <div className="inline-block max-w-full bg-surface2 border border-line rounded-lg rounded-tl-sm px-3 py-2">
            <MessageBody content={message.content} />
          </div>
        ) : (
          <div className="pr-2">
            <MessageBody content={message.content} />
            {streaming && <span className="inline-block w-1.5 h-3.5 bg-accent ml-0.5 align-middle blink" />}
          </div>
        )}

        {!isUser && !streaming && (message.usage || isLast) && (
          <div className="mt-1.5 flex items-center gap-1">
            {message.usage && (
              <button
                onClick={() => setShowUsage((s) => !s)}
                className={`flex items-center gap-1 font-mono text-[10px] px-1.5 py-0.5 rounded border transition-colors ${
                  showUsage ? "border-line text-text" : "border-transparent text-mute hover:text-text"
                }`}
                title="Generation stats"
              >
                <Icon name="info" size={12} /> stats
              </button>
            )}
            {isLast && (
              <button
                onClick={onRegenerate}
                className="flex items-center gap-1 font-mono text-[10px] px-1.5 py-0.5 rounded border border-transparent text-mute hover:text-text"
                title="Regenerate response"
              >
                <Icon name="regen" size={12} /> regenerate
              </button>
            )}
          </div>
        )}
        {!isUser && showUsage && message.usage && <UsageInline usage={message.usage} />}
      </div>
    </div>
  );
}

function ContextDivider() {
  return (
    <div className="flex items-center gap-3 py-1">
      <div className="flex-1 h-px bg-line" />
      <span className="font-mono text-[10px] text-mute uppercase tracking-widest">context cleared</span>
      <div className="flex-1 h-px bg-line" />
    </div>
  );
}

function SystemPromptBar({ value, onChange }) {
  const isDefault = value === DEFAULT_SYS_PROMPT;
  const [editing, setEditing] = useState(false);
  const [expanded, setExpanded] = useState(!isDefault);
  const [draft, setDraft] = useState(value);
  useEffect(() => setDraft(value), [value]);
  useEffect(() => { if (!isDefault) setExpanded(true); }, [isDefault]);

  if (!expanded && !editing) {
    return (
      <div className="flex items-center gap-2 px-3 py-1.5 border border-line bg-surface/40 font-mono text-[10px] text-mute whitespace-nowrap">
        <span className="text-accent uppercase tracking-widest shrink-0">system</span>
        <span className="text-mute shrink-0">·</span>
        <span className="text-text/70 flex-1 min-w-0 truncate">default</span>
        <button onClick={() => setExpanded(true)} className="hover:text-text shrink-0">show ↓</button>
        <button onClick={() => { setEditing(true); setExpanded(true); }} className="hover:text-text shrink-0">edit</button>
      </div>
    );
  }

  return (
    <div className="border border-line bg-surface/60">
      <div className="flex items-center justify-between px-3 py-1.5 border-b border-line">
        <span className="font-mono text-[10px] text-accent uppercase tracking-widest">system prompt</span>
        <div className="flex gap-2">
          {editing ? (
            <>
              <button onClick={() => { onChange(draft); setEditing(false); }} className="font-mono text-[10px] text-accent hover:underline">save</button>
              <button onClick={() => { setDraft(value); setEditing(false); }} className="font-mono text-[10px] text-mute hover:text-text">cancel</button>
            </>
          ) : (
            <>
              <button onClick={() => setEditing(true)} className="font-mono text-[10px] text-mute hover:text-text">edit</button>
              {isDefault && <button onClick={() => setExpanded(false)} className="font-mono text-[10px] text-mute hover:text-text">hide ↑</button>}
            </>
          )}
        </div>
      </div>
      {editing ? (
        <textarea
          value={draft} onChange={(e) => setDraft(e.target.value)} rows={3} autoFocus
          className="w-full bg-transparent px-3 py-2 text-[12.5px] text-text resize-none focus:outline-none"
        />
      ) : (
        <div className="px-3 py-2 text-[12.5px] text-mute leading-relaxed">{value || "No system prompt set."}</div>
      )}
    </div>
  );
}

function EmptyState({ onOpenPicker, modelReady, model }) {
  return (
    <div className="max-w-2xl mx-auto py-10 px-6">
      <div className="border border-line bg-surface">
        <div className="px-6 py-5 border-b border-line">
          <div className="font-mono text-[10px] text-accent uppercase tracking-widest mb-2">readme</div>
          <h2 className="text-lg font-medium">Local-only chat. No server.</h2>
          <p className="text-sm text-mute leading-relaxed mt-2">
            Models run entirely in your browser via WebGPU. Weights download once and
            are cached — then never leave your device.
          </p>
        </div>
        <div className="grid grid-cols-3 divide-x divide-line font-mono text-[11px]">
          {[
            ["1 · pick", "Open the model picker and choose by size."],
            ["2 · load", "First load downloads weights to cache."],
            ["3 · chat", "Generation happens on your GPU."],
          ].map(([h, d]) => (
            <div key={h} className="px-4 py-3">
              <div className="text-accent mb-1">{h}</div>
              <div className="text-mute leading-relaxed">{d}</div>
            </div>
          ))}
        </div>
        <div className="px-6 py-4 border-t border-line">
          {modelReady ? (
            <div className="font-mono text-[11px] text-ok">✓ {shortenId(model)} loaded — type below to begin.</div>
          ) : (
            <button onClick={onOpenPicker} className="font-mono text-[11px] px-3 py-1.5 border border-accent/60 text-accent hover:bg-accent/10">

/* ============ chat: prompt hints + composer ============ */

function PromptHints({ query, templates, onPick }) {
  const matches = templates.filter((t) => t.title.toLowerCase().includes(query.toLowerCase()));
  if (matches.length === 0) return null;
  return (
    <div className="absolute bottom-full left-0 right-0 mb-1.5 border border-line bg-surface max-h-52 overflow-y-auto">
      <div className="px-3 py-1.5 border-b border-line font-mono text-[10px] text-mute uppercase tracking-widest">prompt templates</div>
      {matches.map((t, i) => (
        <button key={t.id} onClick={() => onPick(t)} className={`w-full text-left px-3 py-2 flex items-center justify-between ${i === 0 ? "bg-accent/5" : "hover:bg-surface2"}`}>
          <div className="min-w-0">
            <div className="font-mono text-[12px] text-text">/{t.title}</div>
            <div className="font-mono text-[10px] text-mute truncate">{t.content.replace(/\n/g, " ").trim()}</div>
          </div>
          {t.isBuiltIn && <span className="font-mono text-[9px] text-mute shrink-0 ml-2">built-in</span>}
        </button>
      ))}
    </div>
  );
}

function Composer({ modelReady, model, generating, templates, onSend, onStop, onParams, onClearContext }) {
  const [input, setInput] = useState("");
  const [images, setImages] = useState(0);
  const taRef = useRef(null);

  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 180) + "px";
  }, [input]);

  const hintQuery = input.startsWith("/") && input.length < 40 && !input.includes("\n") ? input.slice(1) : null;

  const send = () => {
    if (!input.trim() || !modelReady || generating) return;
    onSend(input.trim(), images);
    setInput(""); setImages(0);
  };

  return (
    <div className="border-t border-line bg-bg">
      <div className="max-w-3xl mx-auto px-6 py-3">
        {images > 0 && (
          <div className="flex gap-2 mb-2">
            {Array.from({ length: images }).map((_, i) => (
              <div key={i} className="relative group">
                <div className="w-16 h-16 border border-line bg-surface2 flex items-center justify-center text-mute overflow-hidden relative"
                  style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,.025) 4px, rgba(255,255,255,.025) 8px)' }}>
                  <Icon name="image" size={20} />
                  <span className="absolute bottom-0.5 left-1 right-1 font-mono text-[8px] text-mute truncate">img-{i + 1}.png</span>
                </div>
                <button onClick={() => setImages((n) => n - 1)} className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-bg border border-err text-err text-[10px] leading-none flex items-center justify-center hover:bg-err hover:text-bg">×</button>
              </div>
            ))}
          </div>
        )}
        <div className="relative">
          {hintQuery !== null && <PromptHints query={hintQuery} templates={templates} onPick={(t) => setInput(t.content)} />}
          <div className="flex items-end gap-2">
            <textarea
              ref={taRef} value={input} onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey && hintQuery === null) { e.preventDefault(); send(); } }}
              rows={1} disabled={!modelReady}
              placeholder={modelReady ? "Type a message — / for templates, Enter to send" : "Load a model to begin"}
              className="flex-1 resize-none bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[14px] text-text placeholder:text-mute disabled:opacity-40"
              style={{ maxHeight: "180px" }}
            />
            {modelReady && (
              <button onClick={() => setImages((n) => Math.min(n + 1, 3))} disabled={images >= 3} title="Attach image"
                className="px-2.5 py-2 border border-line text-mute hover:text-text hover:bg-surface2 disabled:opacity-30">
                <Icon name="image" size={16} />
              </button>
            )}
            {generating ? (
              <button onClick={onStop} className="font-mono text-[12px] px-3 py-2 border border-err/60 text-err hover:bg-err/10">stop</button>
            ) : (
              <button onClick={send} disabled={!modelReady || !input.trim()}
                className="flex items-center gap-1 font-mono text-[12px] px-3 py-2 border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-30">
                send <Icon name="send" size={14} />
              </button>
            )}
          </div>
        </div>
        <div className="mt-2 flex items-center justify-between font-mono text-[10px] text-mute">
          <div className="flex items-center gap-3">
            <span>{modelReady ? `model · ${shortenId(model)}` : "no model loaded"}</span>
            <button onClick={onClearContext} disabled={!modelReady} className="hover:text-text disabled:opacity-30">clear context</button>
          </div>
          <button onClick={onParams} className="hover:text-text" disabled={!modelReady}>thread parameters →</button>
        </div>
      </div>
    </div>
  );
}

function ChatPage({ thread, messages, model, modelReady, generating, templates, onSend, onStop, onOpenPicker, onParams, onRegenerate, onClearContext, onChangeSystemPrompt }) {
  const scrollRef = useRef(null);
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  return (
    <div className="flex flex-col h-full min-h-0 flex-1">
      <div ref={scrollRef} className="flex-1 overflow-y-auto grid-bg">
        <div className="max-w-3xl mx-auto px-6 pt-6 pb-1">
          {thread && <SystemPromptBar value={thread.systemPrompt} onChange={onChangeSystemPrompt} />}
        </div>
        {messages.length === 0 ? (
          <EmptyState onOpenPicker={onOpenPicker} modelReady={modelReady} model={model} />
        ) : (
          <div className="max-w-3xl mx-auto px-6 pb-6 space-y-5">
            {messages.map((m, i) =>
              m.divider ? (
                <ContextDivider key={i} />
              ) : (
                <MessageView
                  key={i}
                  message={m}
                  modelId={model}
                  streaming={generating && i === messages.length - 1 && m.role === "assistant"}
                  isLast={i === messages.length - 1}
                  onRegenerate={onRegenerate}
                />
              ),
            )}
          </div>
        )}
      </div>
      <Composer
        modelReady={modelReady} model={model} generating={generating} templates={templates}
        onSend={onSend} onStop={onStop} onParams={onParams} onClearContext={onClearContext}
      />
    </div>
  );
}

/* ============ model picker ============ */

function ParamSlider({ label, value, min, max, step, onChange }) {
  return (
    <div className="flex items-center gap-3">
      <label className="font-mono text-[11px] text-mute w-28 shrink-0">{label}</label>
      <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} className="flex-1 h-1 accent-accent" />
      <span className="font-mono text-[11px] text-text w-12 text-right">{step < 1 ? value.toFixed(2) : value}</span>
    </div>
  );
}

function ParamControls({ params, setParams }) {
  const set = (k) => (v) => setParams((p) => ({ ...p, [k]: v }));
  return (
    <div className="space-y-2.5">
      <ParamSlider label="temperature" value={params.temperature} min={0} max={2} step={0.05} onChange={set("temperature")} />
      <ParamSlider label="top_p" value={params.topP} min={0} max={1} step={0.05} onChange={set("topP")} />
      <ParamSlider label="max_tokens" value={params.maxTokens} min={64} max={16384} step={64} onChange={set("maxTokens")} />
      <ParamSlider label="presence_pen" value={params.presencePenalty} min={-2} max={2} step={0.1} onChange={set("presencePenalty")} />
      <ParamSlider label="frequency_pen" value={params.frequencyPenalty} min={-2} max={2} step={0.1} onChange={set("frequencyPenalty")} />
    </div>

}

function StatusPanel({ engineState, progress }) {
  if (engineState === "idle") return null;
  const isLoading = engineState === "loading";
  const isError = engineState === "error";
  const pct = Math.round(progress.value * 100);
  return (
    <div className={`border-l-2 ${isError ? "border-err" : isLoading ? "border-accent" : "border-ok"} bg-surface px-3 py-2.5`}>
      <div className="flex items-center justify-between mb-1">
        <div className="font-mono text-[10px] uppercase tracking-widest text-mute">{isLoading ? "loading" : isError ? "error" : "ready"}</div>
        {isLoading && <div className="font-mono text-[11px] text-accent">{pct}%</div>}
      </div>
      <div className={`font-mono text-[11px] ${isError ? "text-err" : "text-text"} leading-snug break-words`}>{progress.text}</div>
      {isLoading && (
        <div className="mt-2 h-1 bg-bg border border-line overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{ width: `${pct}%` }} />
        </div>
      )}
    </div>
  );
}

function FamilyChip({ family, active, onClick }) {
  return (
    <button onClick={onClick}
      className={`flex items-center gap-1.5 pl-1.5 pr-3 py-1.5 rounded-full border text-[12px] transition-colors ${
        active ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:border-lineHi hover:text-text"
      }`}>
      <BrandLogo brand={BRAND[family]} size={17} />
      {family}
    </button>
  );
}

function ModelGridCard({ model, system, loadedId, recommended, engineState, onLoad, onUnload, onEvict }) {
  const [open, setOpen] = useState(false);
  const anyLoaded = model.variants.some((v) => v.id === loadedId);
  const anyCached = model.variants.some((v) => v.cached);
  const minVram = Math.min(...model.variants.map((v) => v.vram));
  const fit = fitFor(minVram, system.deviceMemoryGB);
  return (
    <div className={`rounded-xl border overflow-hidden self-start transition-colors ${anyLoaded ? "border-accent/60 bg-accent/[0.07]" : "border-line bg-surface hover:border-lineHi"}`}>
      <button onClick={() => setOpen((o) => !o)} className="w-full flex items-center gap-2.5 px-3 py-2.5 text-left">
        <BrandLogo brand={BRAND[model.family]} size={22} />
        <div className="flex-1 min-w-0">
          <div className="text-[12.5px] text-text truncate leading-tight">{model.name}</div>
          <div className="font-mono text-[10px] mt-0.5 flex items-center gap-1 whitespace-nowrap overflow-hidden">
            <span className="text-mute">{fmtMB(minVram)}{model.variants.length > 1 ? ` · ${model.variants.length} var` : ""}</span>
            {recommended && !anyLoaded && <span className="text-accent">· recommended</span>}
            {!fit.fits && !fit.tight && <span className="text-err">· too large</span>}
            {fit.tight && <span className="text-warn">· tight</span>}
          </div>
        </div>
        {anyLoaded && <Badge tone="accent">loaded</Badge>}
        {!anyLoaded && anyCached && <Dot tone="ok" />}
        <span className="text-mute"><Chevron open={open} /></span>
      </button>
      {open && (
        <div className="border-t border-line">
          {model.variants.map((v) => {
            const vf = fitFor(v.vram, system.deviceMemoryGB);
            const loaded = v.id === loadedId;
            return (
              <div key={v.id} className="flex items-center gap-1.5 px-3 py-2 border-t border-line/50 first:border-t-0 bg-bg/30">
                <span className="font-mono text-[10px] text-mute uppercase w-12 shrink-0">{v.quant}</span>
                <span className="font-mono text-[10px] text-mute w-12 shrink-0">{fmtMB(v.vram)}</span>
                <div className="flex-1 min-w-0 flex gap-1 overflow-hidden">
                  {loaded && <Badge tone="accent">loaded</Badge>}
                  {v.cached && !loaded && <Badge tone="ok">cached</Badge>}
                  {!vf.fits && !vf.tight && !loaded && <Badge tone="err">too large</Badge>}
                  {vf.tight && !loaded && <Badge tone="warn">tight</Badge>}
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  {loaded ? (
                    <button onClick={onUnload} className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-line text-mute hover:text-text">unload</button>
                  ) : (
                    <button onClick={() => onLoad(v.id)} disabled={engineState === "loading"}
                      className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-40">
                      {v.cached ? "load" : "download"}
                    </button>
                  )}
                  {v.cached && (
                    <button onClick={() => onEvict(v.id)} className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-line text-mute hover:text-err hover:border-err/40">evict</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function EmbedModelRow({ model, system, loadedId, embedState, onLoad, onUnload, onEvict }) {
  const loaded = model.id === loadedId;
  const fit = fitFor(model.vram, system.deviceMemoryGB);
  return (
    <div className={`flex items-center gap-3 px-3 py-2.5 border ${loaded ? "border-accent/60 bg-accent/[0.07]" : "border-line bg-surface hover:border-lineHi"}`}>
      <BrandLogo brand={model.brand} size={22} />
      <div className="flex-1 min-w-0">
        <div className="text-[12.5px] text-text truncate leading-tight">{model.name}</div>
        <div className="font-mono text-[10px] mt-0.5 text-mute">
          {fmtMB(model.vram)} · dim {model.dim}
          {!fit.fits && !fit.tight && <span className="text-err"> · too large</span>}
          {fit.tight && <span className="text-warn"> · tight</span>}
        </div>
      </div>
      {loaded && <Badge tone="accent">loaded</Badge>}
      {!loaded && model.cached && <Badge tone="ok">cached</Badge>}
      <div className="flex items-center gap-1 shrink-0">
        {loaded ? (
          <button onClick={onUnload} className="font-mono text-[10px] px-1.5 py-0.5 border border-line text-mute hover:text-text">unload</button>
        ) : (
          <button onClick={() => onLoad(model.id)} disabled={embedState === "loading"}
            className="font-mono text-[10px] px-1.5 py-0.5 border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-40">
            {model.cached ? "load" : "download"}
          </button>
        )}
        {model.cached && (
          <button onClick={() => onEvict(model.id)} className="font-mono text-[10px] px-1.5 py-0.5 border border-line text-mute hover:text-err hover:border-err/40">evict</button>
        )}
      </div>
    </div>
  );
}

function ModelPicker({ open, onClose, system, loadedModel, engineState, progress,
                       loadedEmbed, embedState, embedProgress,
                       type, setType, defaultParams, setDefaultParams,
                       onLoad, onUnload, onUnloadEmbed, onEvict, onAddCustom }) {
  const [search, setSearch] = useState("");
  const [family, setFamily] = useState(null);
  const [hideTooLarge, setHideTooLarge] = useState(true);
  const [showParams, setShowParams] = useState(false);

  const families = useMemo(() => FAMILY_ORDER.filter((f) => MOCK_MODELS.some((m) => m.family === f)), []);
  const totalVariants = useMemo(() => MOCK_MODELS.reduce((n, m) => n + m.variants.length, 0), []);
  const minVramOf = (m) => Math.min(...m.variants.map((v) => v.vram));

  const recommendedName = useMemo(() => {
    const sorted = [...MOCK_MODELS].sort((a, b) => minVramOf(a) - minVramOf(b));
    const r = sorted.find((m) => fitFor(minVramOf(m), system.deviceMemoryGB).fits);
    return r ? r.name : null;
  }, [system]);

  const filtered = useMemo(() => {
    let list = MOCK_MODELS;
    if (family) list = list.filter((m) => m.family === family);
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter((m) => m.name.toLowerCase().includes(q) || m.family.toLowerCase().includes(q));
    }
    if (hideTooLarge) {
      list = list.filter((m) => m.variants.some((v) => {
        const f = fitFor(v.vram, system.deviceMemoryGB);
        return f.fits || f.tight || v.cached || v.id === loadedModel;
      }));
    }
    return [...list].sort((a, b) => minVramOf(a) - minVramOf(b));
  }, [search, family, hideTooLarge, system, loadedModel]);

  const filteredEmbed = useMemo(() => {
    let list = MOCK_EMBED_MODELS;
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter((m) => m.name.toLowerCase().includes(q));
    }
    return [...list].sort((a, b) => a.vram - b.vram);
  }, [search]);

  const subtitle = type === "chat"
    ? `${filtered.length} chat models · ${totalVariants} variants · runs in-browser via WebLLM`
    : `${filteredEmbed.length} embedding models · vectors are tagged to the producing model (D2)`;

  return (
    <Modal open={open} onClose={onClose} title="Model selection" subtitle={subtitle} width="max-w-4xl">
      <div className="px-4 pt-3 border-b border-line space-y-3 sticky top-0 bg-bg z-10">
        <div className="flex gap-1.5">
          <button onClick={() => setType("chat")}
            className={`flex items-center gap-1.5 px-3 py-1.5 border text-[12px] transition-colors whitespace-nowrap ${type === "chat" ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:text-text"}`}>
            <Icon name="chat" size={14} /> Chat models
          </button>
          <button onClick={() => setType("embed")}
            className={`flex items-center gap-1.5 px-3 py-1.5 border text-[12px] transition-colors whitespace-nowrap ${type === "embed" ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:text-text"}`}>
            <Icon name="vectormap" size={14} /> Embedding models
          </button>
        </div>
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-mute"><Icon name="search" size={15} /></span>
          <input type="text" value={search} onChange={(e) => setSearch(e.target.value)}
            placeholder={type === "chat" ? "Search chat models…" : "Search embedding models…"}
            className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none pl-9 pr-3 py-2 text-[13px]" />
        </div>
        {type === "chat" && (
          <div className="flex flex-wrap gap-1.5">
            <button onClick={() => setFamily(null)}
              className={`px-3 py-1.5 border text-[12px] transition-colors ${family === null ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:text-text"}`}>
              All
            </button>
            {families.map((f) => <FamilyChip key={f} family={f} active={family === f} onClick={() => setFamily(family === f ? null : f)} />)}
          </div>
        )}
        <div className="flex items-center justify-between pb-3">
          {type === "chat" ? (
            <label className="flex items-center gap-2 font-mono text-[11px] text-mute cursor-pointer">
              <input type="checkbox" checked={hideTooLarge} onChange={(e) => setHideTooLarge(e.target.checked)} className="accent-accent" />
              hide models too large for this device
            </label>
          ) : (
            <div className="font-mono text-[10px] text-mute">
              embedding models are required for the Knowledge surface (Phase 3)
            </div>
          )}
          {type === "chat" && (
            <button onClick={onAddCustom} className="font-mono text-[11px] text-mute hover:text-accent border border-line px-2 py-1">+ custom model</button>
          )}
        </div>
        <div className="pb-3">
          <StatusPanel engineState={type === "chat" ? engineState : embedState} progress={type === "chat" ? progress : embedProgress} />
        </div>
      </div>

      <div className="p-4">
        {type === "chat" ? (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 items-start">
            {filtered.map((m) => (
              <ModelGridCard key={m.name} model={m} system={system} loadedId={loadedModel}
                recommended={m.name === recommendedName} engineState={engineState}
                onLoad={onLoad} onUnload={onUnload} onEvict={onEvict} />
            ))}
          </div>
        ) : (
          <div className="space-y-1.5">
            {filteredEmbed.map((m) => (
              <EmbedModelRow key={m.id} model={m} system={system} loadedId={loadedEmbed} embedState={embedState}
                onLoad={onLoad} onUnload={onUnloadEmbed} onEvict={onEvict} />
            ))}
          </div>
        )}
        {(type === "chat" ? filtered.length === 0 : filteredEmbed.length === 0) && (
          <div className="font-mono text-[12px] text-mute text-center py-12">No models match your search.</div>
        )}
      </div>

      {type === "chat" && (
        <div className="border-t border-line">
          <button onClick={() => setShowParams((s) => !s)} className="w-full flex items-center justify-between px-4 py-2.5 font-mono text-[11px] text-mute hover:text-text">
            <span>default generation parameters</span>
            <span>{showParams ? "−" : "+"}</span>
          </button>
          {showParams && (
            <div className="px-4 pb-4">
              <ParamControls params={defaultParams} setParams={setDefaultParams} />
              <div className="font-mono text-[10px] text-mute mt-2.5">Applied to new threads. Per-thread overrides live in thread parameters.</div>
            </div>
          )}
        </div>
      )}
    </Modal>
  );
}

/* ============ thread params ============ */

function ThreadParams({ open, onClose, params, setParams, defaults, onReset }) {
  const overridden = JSON.stringify(params) !== JSON.stringify(defaults);
  return (
    <Modal open={open} onClose={onClose} title="Thread parameters" subtitle="Overrides for this conversation only" width="max-w-md">
      <div className="p-4 space-y-3">
        <ParamControls params={params} setParams={setParams} />
        <div className="flex items-center justify-between border-t border-line pt-3">
          <span className="font-mono text-[10px] text-mute">{overridden ? "overriding global defaults" : "matching global defaults"}</span>
          <button onClick={onReset} disabled={!overridden} className="font-mono text-[11px] px-2.5 py-1 border border-line text-mute hover:text-text disabled:opacity-30">reset to defaults</button>
        </div>
      </div>
    </Modal>
  );
}

/* ============ settings ============ */

function ProviderRow({ p, state, onUpdate }) {
  const [showKey, setShowKey] = useState(false);
  const tone = state.status === "ready" || state.status === "detected" ? "ok"
             : state.status === "no-key" ? "warn"
             : state.status === "error" || state.status === "not-detected" ? "err"
             : "neutral";
  const statusText = {
    ready: "ready", detected: "detected", "not-detected": "not detected",
    "no-key": "needs key", error: "error",
  }[state.status] || state.status;

  return (
    <div className="border border-line bg-surface">
      <div className="flex items-center gap-3 px-3 py-2.5">
        <div className="w-8 h-8 border border-line bg-bg flex items-center justify-center text-mute shrink-0">
          {p.kind === "local" && <Icon name="chat" size={16} />}
          {p.kind === "local-host" && <Icon name="server" size={16} />}
          {p.kind === "byok" && <Icon name="key" size={16} />}
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[13px] text-text">{p.name}</span>
            {p.builtIn && <Badge tone="neutral" mono>built-in</Badge>}
            {p.phase && <Badge tone="neutral" mono>phase {p.phase}</Badge>}
            <Badge tone={tone}><Dot tone={tone} /> {statusText}</Badge>
          </div>
          <div className="font-mono text-[10px] text-mute mt-0.5">{p.desc}</div>
        </div>
        <button
          onClick={() => onUpdate({ enabled: !state.enabled })}
          className={`font-mono text-[11px] px-2.5 py-1 border whitespace-nowrap ${state.enabled ? "border-accent/60 text-accent bg-accent/5" : "border-line text-mute"} hover:text-text`}
        >
          {state.enabled ? "enabled" : "enable"}
        </button>
      </div>

      {(p.urlEditable || p.kind === "local-host") && (
        <div className="border-t border-line px-3 py-2 flex items-center gap-2">
          <span className="font-mono text-[10px] text-mute uppercase tracking-widest w-12 shrink-0">url</span>
          <input
            value={state.url || ""}
            onChange={(e) => onUpdate({ url: e.target.value })}
            placeholder={p.url || "https://api.example.com/v1"}
            className="flex-1 bg-bg border border-line focus:border-accent/60 focus:outline-none px-2.5 py-1 text-[11.5px] font-mono"
          />
          <button className="font-mono text-[10px] px-2 py-1 border border-line text-mute hover:text-text">test</button>
        </div>
      )}

      {p.needsKey && (
        <div className="border-t border-line px-3 py-2 flex items-center gap-2">
          <span className="font-mono text-[10px] text-mute uppercase tracking-widest w-12 shrink-0">key</span>
          <input
            type={showKey ? "text" : "password"}
            value={state.key || ""}
            onChange={(e) => onUpdate({ key: e.target.value, status: e.target.value ? "ready" : "no-key" })}
            placeholder="sk-…"
            className="flex-1 bg-bg border border-line focus:border-accent/60 focus:outline-none px-2.5 py-1 text-[11.5px] font-mono"
          />
          <button onClick={() => setShowKey((s) => !s)} className="text-mute hover:text-text p-1" title={showKey ? "Hide" : "Show"}>
            <Icon name={showKey ? "eyeoff" : "eye"} size={14} />
          </button>
          <button className="font-mono text-[10px] px-2 py-1 border border-line text-mute hover:text-text">test</button>
        </div>
      )}
    </div>
  );
}

function SettingsModal({ open, onClose, templates, setTemplates, defaultParams, setDefaultParams,
                         defaultSysPrompt, setDefaultSysPrompt, providerStates, setProviderStates }) {
  const [tab, setTab] = useState("templates");
  const [draft, setDraft] = useState({ title: "", content: "" });

  const addTemplate = () => {
    if (!draft.title.trim()) return;
    setTemplates((t) => [...t, { id: "u" + Date.now(), title: draft.title.trim(), content: draft.content, isBuiltIn: false }]);
    setDraft({ title: "", content: "" });
  };

  const updateProvider = (id, patch) =>
    setProviderStates((s) => ({ ...s, [id]: { ...s[id], ...patch } }));

  const tabs = [
    ["templates", "Prompt templates"],
    ["providers", "Providers"],
    ["params", "Defaults"],
    ["about", "About"],
  ];

  return (
    <Modal open={open} onClose={onClose} title="Settings" width="max-w-3xl">
      <div className="flex border-b border-line">
        {tabs.map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={`font-mono text-[11px] px-4 py-2.5 border-r border-line ${tab === id ? "text-accent bg-accent/5" : "text-mute hover:text-text"}`}>
            {label}
          </button>
        ))}
      </div>

      {tab === "templates" && (
        <div className="p-4 space-y-4">
          <div className="space-y-1">
            {templates.map((t) => (
              <div key={t.id} className="group flex items-center gap-2 border border-line bg-surface px-3 py-2">
                <div className="flex-1 min-w-0">
                  <div className="font-mono text-[12px] text-text">/{t.title}</div>
                  <div className="font-mono text-[10px] text-mute truncate">{t.content.replace(/\n/g, " ").trim()}</div>
                </div>
                {t.isBuiltIn ? (
                  <span className="font-mono text-[9px] text-mute shrink-0">built-in</span>
                ) : (
                  <button onClick={() => setTemplates((arr) => arr.filter((x) => x.id !== t.id))}
                    className="opacity-0 group-hover:opacity-100 font-mono text-[11px] text-mute hover:text-err shrink-0">delete</button>
                )}
              </div>
            ))}
          </div>
          <div className="border-t border-line pt-4 space-y-2">
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest">new template</div>
            <input value={draft.title} onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))} placeholder="Title (used as /trigger)"
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-1.5 text-[12px] font-mono" />
            <textarea value={draft.content} onChange={(e) => setDraft((d) => ({ ...d, content: e.target.value }))} placeholder="Template content inserted into the composer…" rows={3}
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[12px] resize-none" />
            <button onClick={addTemplate} className="font-mono text-[11px] px-3 py-1.5 border border-accent/60 text-accent hover:bg-accent/10">+ add template</button>
          </div>
        </div>
      )}

      {tab === "providers" && (
        <div className="p-4 space-y-4">
          <p className="text-[12.5px] text-mute leading-relaxed">
            Providers expose models from different runtimes. <span className="text-text">WebLLM</span> runs in this browser.
            Localhost providers (Ollama, LM Studio) need a running daemon. BYOK providers store keys
            in IndexedDB on this device only.
          </p>

          <div>
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">in-browser</div>
            <div className="space-y-1.5">
              {PROVIDERS.filter((p) => p.kind === "local").map((p) => (
                <ProviderRow key={p.id} p={p} state={providerStates[p.id]} onUpdate={(patch) => updateProvider(p.id, patch)} />
              ))}
            </div>
          </div>

          <div>
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">localhost daemons</div>
            <div className="space-y-1.5">
              {PROVIDERS.filter((p) => p.kind === "local-host").map((p) => (
                <ProviderRow key={p.id} p={p} state={providerStates[p.id]} onUpdate={(patch) => updateProvider(p.id, patch)} />
              ))}
            </div>
            <div className="mt-2 font-mono text-[10px] text-mute">Auto-detected at startup; status updates as you toggle "enabled".</div>
          </div>

          <div>
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">bring your own key (byok)</div>
            <div className="space-y-1.5">
              {PROVIDERS.filter((p) => p.kind === "byok").map((p) => (
                <ProviderRow key={p.id} p={p} state={providerStates[p.id]} onUpdate={(patch) => updateProvider(p.id, patch)} />
              ))}
            </div>
            <div className="mt-2 font-mono text-[10px] text-mute">Keys are stored in IndexedDB. Nothing leaves this device until you make a request.</div>
          </div>
        </div>
      )}

      {tab === "params" && (
        <div className="p-4 space-y-4">
          <div>
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-1.5">default system prompt</div>
            <textarea
              value={defaultSysPrompt}
              onChange={(e) => setDefaultSysPrompt(e.target.value)}
              rows={3}
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[12.5px] text-text resize-none"
            />
            <div className="font-mono text-[10px] text-mute mt-1">Applied to new threads. Each thread's system prompt can then be edited independently.</div>
          </div>
          <div className="border-t border-line pt-4">
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">default generation parameters</div>
            <ParamControls params={defaultParams} setParams={setDefaultParams} />
            <div className="font-mono text-[10px] text-mute mt-2">New threads inherit these. Each thread can override them independently.</div>
          </div>
        </div>
      )}

      {tab === "about" && (
        <div className="p-4 space-y-3 text-[12px] text-mute leading-relaxed">
          <div className="font-mono text-sm text-text">ht[LLM]</div>
          <p>A fully client-side WebGPU chat app. No server, no telemetry. Threads, messages, documents, settings and API keys live only in this browser's IndexedDB.</p>
          <div className="font-mono text-[11px] border-t border-line pt-3 space-y-1">
            <div><span className="text-mute">runtime</span> · WebLLM · WebGPU</div>
            <div><span className="text-mute">storage</span> · IndexedDB (local only)</div>
            <div><span className="text-mute">providers</span> · WebLLM now · Ollama / LM Studio / Groq / OpenRouter next</div>
            <div><span className="text-mute">planned</span> · Functions (P4) · Agents (P4) · Artifact preview (P5) · Vector-map (P5)</div>
          </div>
        </div>
      )}
    </Modal>
  );
}

          <label className="font-mono text-[10px] text-mute uppercase tracking-widest">model library URL</label>

/* ============ knowledge page (RAG) ============ */

function EmbeddingBar({ loadedEmbed, embedState, onOpenPicker, mismatchCorpora }) {
  const model = MOCK_EMBED_MODELS.find((m) => m.id === loadedEmbed);
  if (!loadedEmbed || embedState !== "ready") {
    return (
      <div className="border border-warn/40 bg-warn/5 px-3 py-2.5 mb-4 flex items-center gap-3">
        <Icon name="warn" size={16} />
        <div className="flex-1 min-w-0">

function StoragePage({ system, models, loadedModel, loadedEmbed, onEvict }) {
  const cached = [];
  models.forEach((m) => m.variants.forEach((v) => { if (v.cached) cached.push({ ...v, family: m.family, name: m.name }); }));
  const cachedEmbeds = MOCK_EMBED_MODELS.filter((m) => m.cached);
  const cacheBytes = cached.reduce((n, v) => n + v.vram * 1024 ** 2, 0)
                   + cachedEmbeds.reduce((n, v) => n + v.vram * 1024 ** 2, 0);
  const embedBytes = MOCK_CORPORA.reduce((n, c) => n + c.vectorBytes, 0);
  const idbBytes = 6.2 * 1024 ** 2;
  const docBytes = MOCK_DOCS.reduce((n, d) => n + d.size, 0);
  const used = cacheBytes + idbBytes + docBytes + embedBytes;

  return (
    <div className="flex-1 overflow-y-auto grid-bg">
      <div className="max-w-3xl mx-auto px-6 py-8 space-y-7">
        <div>
          <div className="mb-1 font-mono text-[10px] text-accent uppercase tracking-widest">storage</div>
          <h1 className="text-xl font-medium mb-3">Data &amp; cache</h1>
          <StorageBar used={used} total={system.storage.quota} />
          <div className="mt-2 flex gap-4 font-mono text-[10px] text-mute flex-wrap">
            <span><span className="text-accent">■</span> model cache {fmtBytes(cacheBytes)}</span>
            <span><span className="text-info">■</span> vectors {fmtBytes(embedBytes)}</span>
            <span><span className="text-text">■</span> app data {fmtBytes(idbBytes)}</span>
            <span><span className="text-mute">■</span> documents {fmtBytes(docBytes)}</span>
          </div>
        </div>

        {/* model weights */}
        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2 flex items-center justify-between">
            <span>cached model weights · {cached.length + cachedEmbeds.length}</span>
            <span>{fmtBytes(cacheBytes)}</span>
          </div>
          <div className="space-y-1">
            {cached.length === 0 && cachedEmbeds.length === 0 && (
              <div className="border border-line border-dashed bg-surface/30 px-4 py-6 text-center font-mono text-[11px] text-mute">
                No cached weights. Loading a model will cache it here.
              </div>
            )}
            {cached.map((v) => (
              <div key={v.id} className="flex items-center gap-3 border border-line bg-surface px-3 py-2.5">
                <BrandLogo brand={BRAND[v.family]} size={20} />
                <Badge tone="neutral" mono>chat</Badge>
                <div className="flex-1 min-w-0">
                  <div className="text-[12.5px] text-text truncate">{shortenId(v.id)}</div>
                  <div className="font-mono text-[10px] text-mute">{v.quant} · {fmtMB(v.vram)}{v.id === loadedModel ? " · loaded" : ""}</div>
                </div>
                <button onClick={() => onEvict(v.id)} className="font-mono text-[10px] px-2 py-1 border border-line text-mute hover:text-err hover:border-err/40">evict</button>
              </div>
            ))}
            {cachedEmbeds.map((m) => (
              <div key={m.id} className="flex items-center gap-3 border border-line bg-surface px-3 py-2.5">
                <BrandLogo brand={m.brand} size={20} />
                <Badge tone="neutral" mono>embed</Badge>
                <div className="flex-1 min-w-0">
                  <div className="text-[12.5px] text-text truncate">{shortenId(m.id)}</div>
                  <div className="font-mono text-[10px] text-mute">dim {m.dim} · {fmtMB(m.vram)}{m.id === loadedEmbed ? " · loaded" : ""}</div>
                </div>
                <button onClick={() => onEvict(m.id)} className="font-mono text-[10px] px-2 py-1 border border-line text-mute hover:text-err hover:border-err/40">evict</button>
              </div>
            ))}
          </div>
        </section>

        {/* embeddings store — per corpus, model-tagged (D2) */}
        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2 flex items-center justify-between">
            <span>embedding vectors · {MOCK_CORPORA.length} corpora</span>
            <span>{fmtBytes(embedBytes)}</span>
          </div>
          {MOCK_CORPORA.length > 0 ? (
            <div className="space-y-1">
              {MOCK_CORPORA.map((c) => {
                const mismatch = loadedEmbed && c.embeddingModel !== loadedEmbed;
                const model = MOCK_EMBED_MODELS.find((m) => m.id === c.embeddingModel);
                return (
                  <div key={c.id} className="border border-line bg-surface">
                    <div className="flex items-center gap-3 px-3 py-2.5">
                      <div className="w-8 h-8 border border-line bg-bg flex items-center justify-center">
                        <Icon name="vectormap" size={16} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-[12.5px] text-text">{c.name}</div>
                        <div className="font-mono text-[10px] text-mute">
                          {c.chunkCount} vectors · dim {c.dim} · {fmtBytes(c.vectorBytes)}
                        </div>
                      </div>
                      <button className="font-mono text-[10px] px-2 py-1 border border-line text-mute hover:text-err hover:border-err/40">delete</button>
                    </div>
                    <div className={`border-t border-line px-3 py-2 flex items-center gap-2 text-[10.5px] font-mono ${mismatch ? "bg-warn/5" : "bg-bg/30"}`}>
                      {mismatch ? <Icon name="warn" size={11} /> : <Dot tone="accent" />}
                      <span className="text-mute">tagged to</span>
                      <span className="text-text">{shortenId(c.embeddingModel)}</span>
                      {model && <span className="text-mute">· dim {model.dim}</span>}
                      {mismatch && (
                        <>
                          <span className="text-warn ml-auto">switching to {shortenId(loadedEmbed)} requires re-embed</span>
                          <button className="border border-warn/60 text-warn hover:bg-warn/10 px-2 py-0.5">re-embed →</button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="border border-line border-dashed bg-surface/30 px-4 py-6 text-center font-mono text-[11px] text-mute">
              No corpora yet. Create one in Knowledge.
            </div>
          )}
          <div className="mt-2 font-mono text-[10px] text-mute/80">
            D2 · vectors are tagged to the embedding model that produced them; comparison across models is meaningless.
          </div>
        </section>

        {/* app data */}
        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">application data</div>
          <div className="border border-line bg-surface divide-y divide-line">
            {[
              ["Threads", "3 conversations"],
              ["Messages", "47 messages"],
              ["Prompt templates", "5 templates"],
              ["Provider keys", "0 stored · BYOK in Settings → Providers"],
            ].map(([k, v]) => (
              <div key={k} className="flex items-center justify-between px-3 py-2">
                <span className="text-[12.5px] text-text">{k}</span>
                <span className="font-mono text-[11px] text-mute">{v}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 flex gap-2 flex-wrap">
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-text hover:border-accent/50 hover:text-accent">export all ↓</button>
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-text hover:border-accent/50 hover:text-accent">import ↑</button>
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-mute hover:text-err hover:border-err/40">clear all data</button>
          </div>
        </section>

        {/* documents */}
        <section>
          <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2 flex items-center justify-between">
            <span>documents · {MOCK_DOCS.length}</span>
            <span>{fmtBytes(docBytes)}</span>
          </div>
          {MOCK_DOCS.length > 0 ? (
            <div className="space-y-1">
              {MOCK_DOCS.map((d) => <DocRow key={d.id} d={d} />)}
            </div>
          ) : (
            <div className="border border-line border-dashed bg-surface/30 px-4 py-6 text-center font-mono text-[11px] text-mute">
              No documents indexed.
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

function App() {
  const [stage, setStage] = useState("landing");

  const [progress, setProgress] = useState({ value: 1, text: "Llama-3.2-1B-Instruct loaded" });

  const [embedState, setEmbedState] = useState("ready");
  const [loadedEmbed, setLoadedEmbed] = useState("snowflake-arctic-embed-s-q0f32-MLC");
  const [embedProgress, setEmbedProgress] = useState({ value: 1, text: "snowflake-arctic-embed-s loaded" });

  const [pickerType, setPickerType] = useState("chat");
  const [providerStates, setProviderStates] = useState(() => Object.fromEntries(PROVIDERS.map((p) => [p.id, { ...p, key: "", enabled: p.id === "webllm" || p.id === "ollama" }])));

  const [defaultParams, setDefaultParams] = useState(DEFAULT_PARAMS);
  const [threadParams, setThreadParams] = useState(DEFAULT_PARAMS);
  const [defaultSysPrompt, setDefaultSysPrompt] = useState(DEFAULT_SYS_PROMPT);

  const [modal, setModal] = useState(null);
  const [generating, setGenerating] = useState(false);

  const thread = threads.find((t) => t.id === activeThread) || null;
  const messages = messagesByThread[activeThread] || [];
  const modelReady = engineState === "ready" && !!loadedModel;

  const isEmbedId = (id) => MOCK_EMBED_MODELS.some((m) => m.id === id);

  const loadModel = (id) => {
    const embed = isEmbedId(id);
    const setS = embed ? setEmbedState : setEngineState;
    const setP = embed ? setEmbedProgress : setProgress;
    const setLoaded = embed ? setLoadedEmbed : setLoadedModel;
    setS("loading");
    let v = 0;
    setP({ value: 0, text: "Initializing engine…" });
    const timer = setInterval(() => {
      v += 0.16 + Math.random() * 0.12;
      if (v >= 1) {
        clearInterval(timer);
        setP({ value: 1, text: shortenId(id) + " loaded" });
        setS("ready");
        setLoaded(id);
      } else {
        setP({ value: v, text: `Fetching weights · ${shortenId(id)}` });
      }
    }, 300);
  };
  const unloadModel = () => { setEngineState("idle"); setLoadedModel(null); setProgress({ value: 0, text: "" }); };
  const unloadEmbed = () => { setEmbedState("idle"); setLoadedEmbed(null); setEmbedProgress({ value: 0, text: "" }); };
  const evictModel = (id) => {
    MOCK_MODELS.forEach((m) => { const v = m.variants.find((x) => x.id === id); if (v) v.cached = false; });
    const e = MOCK_EMBED_MODELS.find((m) => m.id === id); if (e) e.cached = false;
    if (id === loadedModel) unloadModel();
    if (id === loadedEmbed) unloadEmbed();
    setThreads((t) => [...t]);
  };

  const newThread = () => {
    const id = "th" + Date.now();
    setThreads((t) => [{ id, title: "New thread", model: loadedModel || "", updatedAt: "now", systemPrompt: defaultSysPrompt }, ...t]);
    setMessagesByThread((m) => ({ ...m, [id]: [] }));
    setActiveThread(id);
    setPage("chat");
  };
  const deleteThread = (id) => {
    setThreads((t) => t.filter((x) => x.id !== id));
    if (activeThread === id) {
      const rest = threads.filter((x) => x.id !== id);
      setActiveThread(rest[0] ? rest[0].id : null);
    }
  };
  const renameThread = (id, title) => setThreads((t) => t.map((x) => (x.id === id ? { ...x, title } : x)));
  const setSystemPrompt = (sp) => setThreads((t) => t.map((x) => (x.id === activeThread ? { ...x, systemPrompt: sp } : x)));
  const clearContext = () =>
    setMessagesByThread((m) => ({ ...m, [activeThread]: [...(m[activeThread] || []), { divider: true }] }));

  const send = (text, imageCount) => {
    const userMsg = { role: "user", content: text, at: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) };
    if (imageCount > 0) userMsg.images = imageCount;
    const reply =
      "This is a mock streamed response for the UI prototype. Real generation runs on your GPU via WebLLM. Here's a sample code block so the rendering can be reviewed:\n\n```js\nconst engine = await CreateMLCEngine(modelId);\nconst reply = await engine.chat.completions.create({ messages });\n```\n\nThe **hybrid** message style, avatars, timestamps and collapsible stats are all visible here.";
    setMessagesByThread((m) => ({ ...m, [activeThread]: [...(m[activeThread] || []), userMsg, { role: "assistant", content: "", at: userMsg.at }] }));
    setGenerating(true);
    let shown = 0;
    const timer = setInterval(() => {
      shown += 5;
      const done = shown >= reply.length;
      setMessagesByThread((m) => {
        const arr = [...(m[activeThread] || [])];
        arr[arr.length - 1] = {
          role: "assistant", at: userMsg.at, content: reply.slice(0, shown),
          usage: done ? { prompt: 44, completion: 92, prefill: 401.2, decode: 73.5 } : undefined,
        };
        return { ...m, [activeThread]: arr };
      });
      if (done) {
        clearInterval(timer);
        setGenerating(false);
        setThreads((t) => t.map((x) => (x.id === activeThread && x.title === "New thread" ? { ...x, title: text.slice(0, 40) } : x)));
      }
    }, 55);
  };

  const regenerate = () => {
    setMessagesByThread((m) => {
      const arr = [...(m[activeThread] || [])];
      while (arr.length && arr[arr.length - 1].role === "assistant") arr.pop();
      return { ...m, [activeThread]: arr };
    });
    const last = [...messages].reverse().find((x) => x.role === "user");
    if (last) setTimeout(() => send(last.content, 0), 30);
  };

  if (stage === "landing") {
    return (
      <React.Fragment>
        <Landing onEnter={() => setStage("app")} />
        <StageBar stage={stage} setStage={setStage} />
      </React.Fragment>
    );
  }

  const noGPU = stage === "noGPU";
  const system = { ...MOCK_SYSTEM, webgpu: !noGPU };

  return (
    <React.Fragment>
      <div className="h-screen flex overflow-hidden">
        <NavRail page={page} setPage={setPage} onOpenSettings={() => setModal("settings")} />

        <div className="flex-1 flex flex-col min-w-0">
          <header className="border-b border-line bg-bg px-4 py-2 flex items-center justify-between gap-4">
            <div className="flex items-center gap-1.5 min-w-0">
              <ModelSlot role="chat" model={loadedModel} state={engineState} progress={progress}
                onClick={() => { setPickerType("chat"); setModal("picker"); }} />
              <ModelSlot role="embed" model={loadedEmbed} state={embedState} progress={embedProgress}
                onClick={() => { setPickerType("embed"); setModal("picker"); }} />
            </div>
            <SystemStats system={system} compact />
          </header>

          {noGPU ? (
            <WebGPUBlock />
          ) : (
            <div className="flex-1 flex min-h-0">
              {page === "chat" && (
                <React.Fragment>
                  <Sidebar
                    threads={threads} activeId={activeThread} onSelect={setActiveThread}
                    onNew={newThread} onDelete={deleteThread} onRename={renameThread}
                    model={loadedModel} engineState={engineState} onOpenPicker={() => { setPickerType("chat"); setModal("picker"); }}
                  />
                  {activeThread ? (
                    <ChatPage
                      thread={thread} messages={messages} model={loadedModel} modelReady={modelReady}
                      generating={generating} templates={templates}
                      onSend={send} onStop={() => setGenerating(false)}
                      onOpenPicker={() => { setPickerType("chat"); setModal("picker"); }} onParams={() => setModal("params")}
                      onRegenerate={regenerate} onClearContext={clearContext} onChangeSystemPrompt={setSystemPrompt}
                    />
                  ) : (
                    <div className="flex-1 grid-bg flex items-center justify-center">
                      <button onClick={newThread} className="font-mono text-[12px] px-4 py-2 border border-accent/60 text-accent hover:bg-accent/10">+ new chat</button>
                    </div>
                  )}
                </React.Fragment>
              )}
              {page === "knowledge" && <KnowledgePage loadedEmbed={loadedEmbed} embedState={embedState} onOpenEmbedPicker={() => { setPickerType("embed"); setModal("picker"); }} />}
              {page === "storage" && <StoragePage system={system} models={MOCK_MODELS} loadedModel={loadedModel} loadedEmbed={loadedEmbed} onEvict={evictModel} />}
            </div>
          )}
        </div>
      </div>

      <ModelPicker
        open={modal === "picker"} onClose={() => setModal(null)} system={system}
        loadedModel={loadedModel} engineState={engineState} progress={progress}
        loadedEmbed={loadedEmbed} embedState={embedState} embedProgress={embedProgress}
        type={pickerType} setType={setPickerType}
        defaultParams={defaultParams} setDefaultParams={setDefaultParams}
        onLoad={loadModel} onUnload={unloadModel} onUnloadEmbed={unloadEmbed}
        onEvict={evictModel} onAddCustom={() => setModal("custom")}
      />
      <SettingsModal
        open={modal === "settings"} onClose={() => setModal(null)}
        templates={templates} setTemplates={setTemplates}
        defaultParams={defaultParams} setDefaultParams={setDefaultParams}
        defaultSysPrompt={defaultSysPrompt} setDefaultSysPrompt={setDefaultSysPrompt}
        providerStates={providerStates} setProviderStates={setProviderStates}
      />
      <ThreadParams
        open={modal === "params"} onClose={() => setModal(null)}
        params={threadParams} setParams={setThreadParams} defaults={defaultParams}
        onReset={() => setThreadParams(defaultParams)}
      />
      <CustomModelModal open={modal === "custom"} onClose={() => setModal("picker")} />

      <StageBar stage={stage} setStage={setStage} />
    </React.Fragment>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
