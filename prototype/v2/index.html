/* ============ utils ============ */

function fmtMB(mb) {
  if (mb == null) return "—";
  if (mb < 1024) return `${Math.round(mb)} MB`;
  return `${(mb / 1024).toFixed(1)} GB`;
}
function fmtBytes(b) {
  if (b == null) return "—";
  const GB = 1024 ** 3;
  if (b >= GB) return `${(b / GB).toFixed(1)} GB`;
  return `${(b / 1024 ** 2).toFixed(0)} MB`;
}
function shortenId(id) {
  return id.replace(/-MLC$/, "").replace(/-q\df\d+_\d+/, "");
}
function fitFor(vram, ramGB) {
  const budget = (ramGB || 4) * 1024 * 0.7;
  const fits = vram <= budget;
  const tight = !fits && vram <= (ramGB || 4) * 1024;
  return { fits, tight };
}

/* ============ atoms ============ */

function Badge({ tone = "neutral", children, mono = true }) {
  const tones = {
    neutral: "border-line text-mute",
    ok: "border-ok/40 text-ok bg-ok/5",
    warn: "border-warn/40 text-warn bg-warn/5",
    err: "border-err/40 text-err bg-err/5",
    accent: "border-accent/40 text-accent bg-accent/5",
  };
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 text-[11px] border ${tones[tone]} ${mono ? "font-mono" : ""}`}>
      {children}
    </span>
  );
}

function Dot({ tone = "mute" }) {
  const colors = { mute: "bg-mute", ok: "bg-ok", warn: "bg-warn", err: "bg-err", accent: "bg-accent" };
  return <span className={`w-1.5 h-1.5 rounded-full ${colors[tone]}`} />;
}

function Modal({ open, onClose, title, subtitle, children, width = "max-w-2xl" }) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70" onClick={onClose} />
      <div className={`relative z-10 w-full ${width} max-h-[84vh] flex flex-col bg-bg border border-line`}>
        <div className="flex items-start justify-between px-4 py-3 border-b border-line">
          <div>
            <h2 className="font-mono text-sm text-text">{title}</h2>
            {subtitle && <div className="font-mono text-[11px] text-mute mt-0.5">{subtitle}</div>}
          </div>
          <button onClick={onClose} className="font-mono text-[11px] text-mute hover:text-text border border-line px-2 py-1">
            esc
          </button>
        </div>
        <div className="flex-1 overflow-y-auto min-h-0">{children}</div>
      </div>
    </div>
  );
}

function SystemRail({ system }) {
  const ramTone = system.deviceMemoryGB >= 8 ? "ok" : system.deviceMemoryGB >= 4 ? "warn" : "err";
  const storTone = system.storage.free > 2 * 1024 ** 3 ? "ok" : "warn";
  return (
    <div className="flex flex-wrap items-center gap-2">
      <Badge tone={system.webgpu ? "ok" : "err"}>
        <Dot tone={system.webgpu ? "ok" : "err"} /> WebGPU {system.webgpu ? "ok" : "absent"}

      <Badge tone={ramTone}>RAM ≥{system.deviceMemoryGB} GB</Badge>
      <Badge tone="neutral">CPU {system.cores}c</Badge>
      <Badge tone="neutral">buf {fmtBytes(system.gpu.maxBufferSize)}</Badge>
      <Badge tone={storTone}>free {fmtBytes(system.storage.free)}</Badge>
      <Badge tone="neutral">net {system.connection.effectiveType}</Badge>
    </div>
  );
}

        <div className="flex gap-2 pt-1">

function PromptHints({ query, templates, onPick }) {
  const matches = templates.filter((t) => t.title.toLowerCase().includes(query.toLowerCase()));
  if (matches.length === 0) return null;
  return (
    <div className="absolute bottom-full left-0 right-0 mb-1.5 border border-line bg-surface max-h-52 overflow-y-auto">
      <div className="px-3 py-1.5 border-b border-line font-mono text-[10px] text-mute uppercase tracking-widest">
        prompt templates
      </div>
      {matches.map((t, i) => (
        <button
          key={t.id}
          onClick={() => onPick(t)}
          className={`w-full text-left px-3 py-2 flex items-center justify-between ${
            i === 0 ? "bg-accent/5" : "hover:bg-surface2"
          }`}
        >
          <div className="min-w-0">
            <div className="font-mono text-[12px] text-text">/{t.title}</div>
            <div className="font-mono text-[10px] text-mute truncate">{t.content.replace(/\n/g, " ").trim()}</div>
          </div>
          {t.isBuiltIn && <span className="font-mono text-[9px] text-mute shrink-0 ml-2">built-in</span>}
        </button>
      ))}
    </div>
  );
}

function Composer({ modelReady, model, generating, templates, onSend, onStop, onParams }) {
  const [input, setInput] = useState("");
  const [images, setImages] = useState(0);
  const taRef = useRef(null);

  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 180) + "px";
  }, [input]);

  const hintQuery = input.startsWith("/") && input.length < 40 && !input.includes("\n") ? input.slice(1) : null;

  const send = () => {
    if (!input.trim() || !modelReady || generating) return;
    onSend(input.trim(), images);
    setInput("");
    setImages(0);
  };

  return (
    <div className="border-t border-line bg-bg">
      <div className="max-w-3xl mx-auto px-6 py-3">
        {images > 0 && (
          <div className="flex gap-2 mb-2">
            {Array.from({ length: images }).map((_, i) => (
              <div key={i} className="relative group">
                <div className="w-16 h-16 border border-line bg-surface2 flex items-center justify-center font-mono text-[9px] text-mute">
                  img {i + 1}
                </div>
                <button
                  onClick={() => setImages((n) => n - 1)}
                  className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-err text-bg text-[10px] leading-none flex items-center justify-center"
                >
                  ×
                </button>
              </div>
            ))}
          </div>
        )}
        <div className="relative">
          {hintQuery !== null && (
            <PromptHints
              query={hintQuery}
              templates={templates}
              onPick={(t) => setInput(t.content)}
            />
          )}
          <div className="flex items-end gap-2">
            <textarea
              ref={taRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey && hintQuery === null) {
                  e.preventDefault();
                  send();
                }
              }}
              rows={1}
              disabled={!modelReady}
              placeholder={
                modelReady
                  ? "Type a message — / for templates, Enter to send"
                  : "Load a model to begin"
              }
              className="flex-1 resize-none bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[14px] text-text placeholder:text-mute disabled:opacity-40"
              style={{ maxHeight: "180px" }}
            />
            {modelReady && (
              <button
                onClick={() => setImages((n) => Math.min(n + 1, 3))}
                disabled={images >= 3}
                title="Attach image (vision models)"
                className="font-mono text-[12px] px-3 py-2 border border-line text-mute hover:text-text hover:bg-surface2 disabled:opacity-30"
              >
                img
              </button>
            )}
            {generating ? (
              <button
                onClick={onStop}
                className="font-mono text-[12px] px-3 py-2 border border-err/60 text-err hover:bg-err/10"
              >
                stop
              </button>
            ) : (
              <button
                onClick={send}
                disabled={!modelReady || !input.trim()}
                className="font-mono text-[12px] px-3 py-2 border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-30"
              >
                send →
              </button>
            )}
          </div>
        </div>
        <div className="mt-2 flex items-center justify-between font-mono text-[10px] text-mute">
          <span>{modelReady ? `model · ${shortenId(model)}` : "no model loaded"}</span>
          <button onClick={onParams} className="hover:text-text" disabled={!modelReady}>
            thread parameters →
          </button>
        </div>
      </div>
    </div>
  );
}

function ChatPanel({ messages, model, modelReady, generating, templates, onSend, onStop, onOpenPicker, onParams }) {
  const scrollRef = useRef(null);
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  return (
    <div className="flex flex-col h-full min-h-0">
      <div ref={scrollRef} className="flex-1 overflow-y-auto grid-bg">
        {messages.length === 0 ? (
          <EmptyState onOpenPicker={onOpenPicker} modelReady={modelReady} model={model} />
        ) : (
          <div className="max-w-3xl mx-auto px-6 py-6 space-y-6">
            {messages.map((m, i) => (
              <MessageView
                key={i}
                message={m}
                model={model}
                streaming={generating && i === messages.length - 1 && m.role === "assistant"}
              />
            ))}
          </div>
        )}
      </div>
      <Composer
        modelReady={modelReady}
        model={model}
        generating={generating}
        templates={templates}
        onSend={onSend}
        onStop={onStop}
        onParams={onParams}
      />
    </div>
  );
}

function ParamSlider({ label, value, min, max, step, onChange }) {
  return (
    <div className="flex items-center gap-3">
      <label className="font-mono text-[11px] text-mute w-28 shrink-0">{label}</label>
      <input
        type="range" min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(parseFloat(e.target.value))}
        className="flex-1 h-1 accent-accent"
      />
      <span className="font-mono text-[11px] text-text w-12 text-right">
        {step < 1 ? value.toFixed(2) : value}
      </span>
    </div>
  );
}

function ParamControls({ params, setParams }) {
  const set = (k) => (v) => setParams((p) => ({ ...p, [k]: v }));
  return (
    <div className="space-y-2.5">
      <ParamSlider label="temperature" value={params.temperature} min={0} max={2} step={0.05} onChange={set("temperature")} />
      <ParamSlider label="top_p" value={params.topP} min={0} max={1} step={0.05} onChange={set("topP")} />
      <ParamSlider label="max_tokens" value={params.maxTokens} min={64} max={16384} step={64} onChange={set("maxTokens")} />
      <ParamSlider label="presence_pen" value={params.presencePenalty} min={-2} max={2} step={0.1} onChange={set("presencePenalty")} />
      <ParamSlider label="frequency_pen" value={params.frequencyPenalty} min={-2} max={2} step={0.1} onChange={set("frequencyPenalty")} />
    </div>
  );
}

  return (
    <svg
      width="14" height="14" viewBox="0 0 24 24" fill="none"
      className={`shrink-0 transition-transform ${open ? "rotate-180" : ""}`}
    >

function ModelGridCard({ model, system, loadedId, recommended, engineState, onLoad, onUnload, onEvict }) {
  const [open, setOpen] = useState(false);
  const anyLoaded = model.variants.some((v) => v.id === loadedId);
  const anyCached = model.variants.some((v) => v.cached);
  const minVram = Math.min(...model.variants.map((v) => v.vram));
  const fit = fitFor(minVram, system.deviceMemoryGB);

  return (
    <div
      className={`rounded-xl border overflow-hidden self-start transition-colors ${
        anyLoaded ? "border-accent/60 bg-accent/[0.07]" : "border-line bg-surface hover:border-lineHi"
      }`}
    >
      <button onClick={() => setOpen((o) => !o)} className="w-full flex items-center gap-2.5 px-3 py-2.5 text-left">
        <BrandLogo brand={BRAND[model.family]} size={22} />
        <div className="flex-1 min-w-0">
          <div className="text-[12.5px] text-text truncate leading-tight">{model.name}</div>
          <div className="font-mono text-[10px] mt-0.5 flex items-center gap-1 whitespace-nowrap overflow-hidden">
            <span className="text-mute">
              {fmtMB(minVram)}
              {model.variants.length > 1 ? ` · ${model.variants.length} var` : ""}
            </span>
            {recommended && !anyLoaded && <span className="text-accent">· recommended</span>}
            {!fit.fits && !fit.tight && <span className="text-err">· too large</span>}
            {fit.tight && <span className="text-warn">· tight</span>}
          </div>
        </div>
        {anyLoaded && <Badge tone="accent">loaded</Badge>}
        {!anyLoaded && anyCached && <Dot tone="ok" />}
        <span className="text-mute"><Chevron open={open} /></span>
      </button>

      {open && (
        <div className="border-t border-line">
          {model.variants.map((v) => {
            const vf = fitFor(v.vram, system.deviceMemoryGB);
            const loaded = v.id === loadedId;
            return (
              <div key={v.id} className="flex items-center gap-1.5 px-3 py-2 border-t border-line/50 first:border-t-0 bg-bg/30">
                <span className="font-mono text-[10px] text-mute uppercase w-12 shrink-0">{v.quant}</span>
                <span className="font-mono text-[10px] text-mute w-12 shrink-0">{fmtMB(v.vram)}</span>
                <div className="flex-1 min-w-0 flex gap-1 overflow-hidden">
                  {loaded && <Badge tone="accent">loaded</Badge>}
                  {v.cached && !loaded && <Badge tone="ok">cached</Badge>}
                  {!vf.fits && !vf.tight && !loaded && <Badge tone="err">too large</Badge>}
                  {vf.tight && !loaded && <Badge tone="warn">tight</Badge>}
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  {loaded ? (
                    <button onClick={onUnload} className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-line text-mute hover:text-text">
                      unload
                    </button>
                  ) : (
                    <button
                      onClick={() => onLoad(v.id)}
                      disabled={engineState === "loading"}
                      className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-accent/60 text-accent hover:bg-accent/10 disabled:opacity-40"
                    >
                      {v.cached ? "load" : "download"}
                    </button>
                  )}
                  {v.cached && (
                    <button
                      onClick={() => onEvict(v.id)}
                      className="font-mono text-[10px] px-1.5 py-0.5 rounded-md border border-line text-mute hover:text-err hover:border-err/40"
                    >
                      evict
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function StatusPanel({ engineState, progress }) {
  if (engineState === "idle") return null;
  const isLoading = engineState === "loading";
  const isError = engineState === "error";
  const pct = Math.round(progress.value * 100);
  return (
    <div className={`border-l-2 ${isError ? "border-err" : isLoading ? "border-accent" : "border-ok"} bg-surface px-3 py-2.5`}>
      <div className="flex items-center justify-between mb-1">
        <div className="font-mono text-[10px] uppercase tracking-widest text-mute">
          {isLoading ? "loading" : isError ? "error" : "ready"}
        </div>
        {isLoading && <div className="font-mono text-[11px] text-accent">{pct}%</div>}
      </div>
      <div className={`font-mono text-[11px] ${isError ? "text-err" : "text-text"} leading-snug break-words`}>
        {progress.text}
      </div>
      {isLoading && (
        <div className="mt-2 h-1 bg-bg border border-line overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{ width: `${pct}%` }} />
        </div>
      )}
    </div>
  );
}

function ModelPicker({ open, onClose, system, loadedModel, engineState, progress, defaultParams, setDefaultParams, onLoad, onUnload, onEvict, onAddCustom }) {
  const [search, setSearch] = useState("");
  const [family, setFamily] = useState(null);
  const [hideTooLarge, setHideTooLarge] = useState(true);
  const [showParams, setShowParams] = useState(false);

  const families = useMemo(() => FAMILY_ORDER.filter((f) => MOCK_MODELS.some((m) => m.family === f)), []);
  const totalVariants = useMemo(() => MOCK_MODELS.reduce((n, m) => n + m.variants.length, 0), []);

  const minVramOf = (m) => Math.min(...m.variants.map((v) => v.vram));

  const recommendedName = useMemo(() => {
    const sorted = [...MOCK_MODELS].sort((a, b) => minVramOf(a) - minVramOf(b));
    const r = sorted.find((m) => fitFor(minVramOf(m), system.deviceMemoryGB).fits);
    return r ? r.name : null;
  }, [system]);

  const filtered = useMemo(() => {
    let list = MOCK_MODELS;
    if (family) list = list.filter((m) => m.family === family);
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter((m) => m.name.toLowerCase().includes(q) || m.family.toLowerCase().includes(q));
    }
    if (hideTooLarge) {
      list = list.filter((m) =>
        m.variants.some((v) => {
          const f = fitFor(v.vram, system.deviceMemoryGB);
          return f.fits || f.tight || v.cached || v.id === loadedModel;
        }),
      );
    }
    return [...list].sort((a, b) => minVramOf(a) - minVramOf(b));
  }, [search, family, hideTooLarge, system, loadedModel]);

  return (
    <Modal
      open={open}
      onClose={onClose}
      title="Model selection"
      subtitle={`${filtered.length} models · ${totalVariants} variants · runs in-browser via WebLLM`}
      width="max-w-4xl"
    >
      <div className="px-4 py-3 border-b border-line space-y-3 sticky top-0 bg-bg z-10">
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2">
            <SearchIcon />
          </span>
          <input
            type="text" value={search} onChange={(e) => setSearch(e.target.value)}
            placeholder="Search models…"
            className="w-full bg-surface border border-line rounded-lg focus:border-accent/60 focus:outline-none pl-9 pr-3 py-2 text-[13px]"
          />
        </div>
        <div className="flex flex-wrap gap-1.5">
          <button
            onClick={() => setFamily(null)}
            className={`px-3 py-1.5 rounded-full border text-[12px] transition-colors ${
              family === null ? "border-accent/60 bg-accent/10 text-text" : "border-line text-mute hover:text-text"
            }`}
          >
            All
          </button>
          {families.map((f) => (
            <FamilyChip key={f} family={f} active={family === f} onClick={() => setFamily(family === f ? null : f)} />
          ))}
        </div>
        <div className="flex items-center justify-between">
          <label className="flex items-center gap-2 font-mono text-[11px] text-mute cursor-pointer">
            <input type="checkbox" checked={hideTooLarge} onChange={(e) => setHideTooLarge(e.target.checked)} className="accent-accent" />
            hide models too large for this device
          </label>
          <button onClick={onAddCustom} className="font-mono text-[11px] text-mute hover:text-accent border border-line rounded-md px-2 py-1">
            + custom model
          </button>
        </div>
        <StatusPanel engineState={engineState} progress={progress} />
      </div>

      <div className="p-4">
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 items-start">
          {filtered.map((m) => (
            <ModelGridCard
              key={m.name}
              model={m}
              system={system}
              loadedId={loadedModel}
              recommended={m.name === recommendedName}
              engineState={engineState}
              onLoad={onLoad}
              onUnload={onUnload}
              onEvict={onEvict}
            />
          ))}
        </div>
        {filtered.length === 0 && (
          <div className="font-mono text-[12px] text-mute text-center py-12">No models match your search.</div>
        )}
      </div>

      <div className="border-t border-line">
        <button
          onClick={() => setShowParams((s) => !s)}
          className="w-full flex items-center justify-between px-4 py-2.5 font-mono text-[11px] text-mute hover:text-text"
        >
          <span>default generation parameters</span>
          <span>{showParams ? "−" : "+"}</span>
        </button>
        {showParams && (
          <div className="px-4 pb-4">
            <ParamControls params={defaultParams} setParams={setDefaultParams} />
            <div className="font-mono text-[10px] text-mute mt-2.5">
              Applied to new threads. Per-thread overrides live in thread parameters.
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

/* ============ thread params popover ============ */

function ThreadParams({ open, onClose, params, setParams, defaults, onReset }) {
  const overridden = JSON.stringify(params) !== JSON.stringify(defaults);
  return (
    <Modal
      open={open}
      onClose={onClose}
      title="Thread parameters"
      subtitle="Overrides for this conversation only"
      width="max-w-md"
    >
      <div className="p-4 space-y-3">
        <ParamControls params={params} setParams={setParams} />
        <div className="flex items-center justify-between border-t border-line pt-3">
          <span className="font-mono text-[10px] text-mute">
            {overridden ? "overriding global defaults" : "matching global defaults"}
          </span>
          <button
            onClick={onReset}
            disabled={!overridden}
            className="font-mono text-[11px] px-2.5 py-1 border border-line text-mute hover:text-text disabled:opacity-30"
          >
            reset to defaults
          </button>
        </div>
      </div>
    </Modal>
  );
}

  const addTemplate = () => {
    if (!draft.title.trim()) return;
    setTemplates((t) => [...t, { id: "u" + Date.now(), title: draft.title.trim(), content: draft.content, isBuiltIn: false }]);
    setDraft({ title: "", content: "" });
  };

  const tabs = [
    ["data", "Data"],
    ["templates", "Prompt templates"],
    ["about", "About"],
  ];

  return (
    <Modal open={open} onClose={onClose} title="Settings">
      <div className="flex border-b border-line">
        {tabs.map(([id, label]) => (
          <button
            key={id}
            onClick={() => setTab(id)}
            className={`font-mono text-[11px] px-4 py-2.5 border-r border-line ${
              tab === id ? "text-accent bg-accent/5" : "text-mute hover:text-text"
            }`}
          >
            {label}
          </button>
        ))}
      </div>

      {tab === "data" && (
        <div className="p-4 space-y-4">
          <div>
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">export</div>
            <p className="text-[12px] text-mute leading-relaxed mb-2">
              Download all threads, messages, settings and templates as a JSON file.
              API keys are never included.
            </p>
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-text hover:border-accent/50 hover:text-accent">
              export all data ↓
            </button>
          </div>
          <div className="border-t border-line pt-4">
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest mb-2">import</div>
            <p className="text-[12px] text-mute leading-relaxed mb-2">
              Restore from a JSON export. This <span className="text-warn">replaces</span> all
              current data — export first if unsure.
            </p>
            <button className="font-mono text-[11px] px-3 py-1.5 border border-line text-text hover:border-accent/50 hover:text-accent">
              choose file ↑
            </button>
          </div>
        </div>
      )}

      {tab === "templates" && (
        <div className="p-4 space-y-4">
          <div className="space-y-1">
            {templates.map((t) => (
              <div key={t.id} className="group flex items-center gap-2 border border-line bg-surface px-3 py-2">
                <div className="flex-1 min-w-0">
                  <div className="font-mono text-[12px] text-text">/{t.title}</div>
                  <div className="font-mono text-[10px] text-mute truncate">{t.content.replace(/\n/g, " ").trim()}</div>
                </div>
                {t.isBuiltIn ? (
                  <span className="font-mono text-[9px] text-mute shrink-0">built-in</span>
                ) : (
                  <button
                    onClick={() => setTemplates((arr) => arr.filter((x) => x.id !== t.id))}
                    className="opacity-0 group-hover:opacity-100 font-mono text-[11px] text-mute hover:text-err shrink-0"
                  >
                    delete
                  </button>
                )}
              </div>
            ))}
          </div>
          <div className="border-t border-line pt-4 space-y-2">
            <div className="font-mono text-[10px] text-mute uppercase tracking-widest">new template</div>
            <input
              value={draft.title}
              onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))}
              placeholder="Title (used as /trigger)"
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-1.5 text-[12px] font-mono"
            />
            <textarea
              value={draft.content}
              onChange={(e) => setDraft((d) => ({ ...d, content: e.target.value }))}
              placeholder="Template content inserted into the composer…"
              rows={3}
              className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-2 text-[12px] resize-none"
            />
            <button
              onClick={addTemplate}
              className="font-mono text-[11px] px-3 py-1.5 border border-accent/60 text-accent hover:bg-accent/10"
            >
              + add template
            </button>
          </div>
        </div>
      )}

      {tab === "about" && (
        <div className="p-4 space-y-3 text-[12px] text-mute leading-relaxed">
          <div className="font-mono text-sm text-text">ht[LLM]</div>
          <p>
            A fully client-side WebGPU chat app. No server, no telemetry. Threads,
            messages, settings and API keys live only in this browser's IndexedDB.
          </p>
          <div className="font-mono text-[11px] border-t border-line pt-3 space-y-1">
            <div><span className="text-mute">runtime</span> · WebLLM · WebGPU</div>
            <div><span className="text-mute">storage</span> · IndexedDB (local only)</div>
            <div><span className="text-mute">providers</span> · WebLLM now · Ollama / Groq / OpenRouter next</div>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ============ custom model ============ */

function CustomModelModal({ open, onClose }) {
  return (
    <Modal open={open} onClose={onClose} title="Add custom model" subtitle="MLC-compiled models only" width="max-w-lg">
      <div className="p-4 space-y-3">
        <p className="text-[12px] text-mute leading-relaxed">
          WebLLM can run any model compiled to MLC format. Paste the HuggingFace repo
          URL of the MLC weights and the matching model-library URL. Arbitrary
          HuggingFace models (raw safetensors) are not supported — they must be
          compiled with MLC-LLM first.
        </p>
        <div className="space-y-1">
          <label className="font-mono text-[10px] text-mute uppercase tracking-widest">model weights URL</label>
          <input
            placeholder="https://huggingface.co/mlc-ai/…-MLC"
            className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-1.5 text-[12px] font-mono"
          />
        </div>
        <div className="space-y-1">
          <label className="font-mono text-[10px] text-mute uppercase tracking-widest">model library URL</label>
          <input
            placeholder="https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/…"
            className="w-full bg-surface border border-line focus:border-accent/60 focus:outline-none px-3 py-1.5 text-[12px] font-mono"
          />
        </div>
        <div className="flex items-center gap-2 border-t border-line pt-3">
          <button className="font-mono text-[11px] px-3 py-1.5 border border-accent/60 text-accent hover:bg-accent/10">
            add to catalog
          </button>
          <span className="font-mono text-[10px] text-mute">Phase 2 · secondary priority</span>
        </div>
      </div>
    </Modal>
  );
}

/* ============ prototype stage switcher ============ */

function StageBar({ stage, setStage }) {
  const stages = [
    ["landing", "Landing"],
    ["app", "App"],
    ["noGPU", "No WebGPU"],
  ];
  return (
    <div className="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 border border-line bg-surface px-1.5 py-1.5 stripe">
      <span className="font-mono text-[9px] text-mute uppercase tracking-widest px-1.5">prototype</span>
      {stages.map(([id, label]) => (
        <button
          key={id}
          onClick={() => setStage(id)}
          className={`font-mono text-[10px] px-2 py-1 border ${
            stage === id ? "border-accent/60 text-accent bg-accent/10" : "border-line text-mute hover:text-text"
          }`}
        >
          {label}
        </button>
      ))}
    </div>
  );
}

/* ============ app ============ */

const DEFAULT_PARAMS = { temperature: 1.0, topP: 1.0, maxTokens: 4000, presencePenalty: 0, frequencyPenalty: 0 };

function App() {
  const [stage, setStage] = useState("landing");

  const [threads, setThreads] = useState(MOCK_THREADS);
  const [messagesByThread, setMessagesByThread] = useState(MOCK_MESSAGES);
  const [activeThread, setActiveThread] = useState("th1");
  const [templates, setTemplates] = useState(MOCK_TEMPLATES);

  const [engineState, setEngineState] = useState("ready");
  const [loadedModel, setLoadedModel] = useState("Llama-3.2-1B-Instruct-q4f16_1-MLC");
  const [progress, setProgress] = useState({ value: 1, text: "Llama-3.2-1B-Instruct loaded" });

  const [defaultParams, setDefaultParams] = useState(DEFAULT_PARAMS);
  const [threadParams, setThreadParams] = useState(DEFAULT_PARAMS);

  const [modal, setModal] = useState(null); // picker | settings | params | custom
  const [generating, setGenerating] = useState(false);

  const messages = messagesByThread[activeThread] || [];
  const modelReady = engineState === "ready" && !!loadedModel;

  const loadModel = (id) => {
    setEngineState("loading");
    let v = 0;
    setProgress({ value: 0, text: "Initializing engine…" });
    const timer = setInterval(() => {
      v += 0.16 + Math.random() * 0.12;
      if (v >= 1) {
        clearInterval(timer);
        setProgress({ value: 1, text: shortenId(id) + " loaded" });
        setEngineState("ready");
        setLoadedModel(id);
      } else {
        setProgress({ value: v, text: `Fetching weights · ${shortenId(id)}` });
      }
    }, 320);
  };

  const unloadModel = () => {
    setEngineState("idle");
    setLoadedModel(null);
    setProgress({ value: 0, text: "" });
  };

  const evictModel = (id) => {
    MOCK_MODELS.forEach((m) => {
      const v = m.variants.find((x) => x.id === id);
      if (v) v.cached = false;
    });
    if (id === loadedModel) unloadModel();
    setThreads((t) => [...t]);
  };

  const newThread = () => {
    const id = "th" + Date.now();
    setThreads((t) => [{ id, title: "New thread", model: loadedModel || "", updatedAt: "now" }, ...t]);
    setMessagesByThread((m) => ({ ...m, [id]: [] }));
    setActiveThread(id);
  };

  const deleteThread = (id) => {
    setThreads((t) => t.filter((x) => x.id !== id));
    if (activeThread === id) {
      const rest = threads.filter((x) => x.id !== id);
      setActiveThread(rest[0] ? rest[0].id : null);
    }
  };

  const send = (text, imageCount) => {
    const userMsg = { role: "user", content: text };
    if (imageCount > 0) userMsg.images = Array.from({ length: imageCount });
    const reply =
      "This is a mock streamed response for the UI prototype. The real app generates tokens on your GPU via WebLLM; here we just echo a fixed paragraph so the chat layout, streaming cursor and throughput readout can be reviewed.";
    setMessagesByThread((m) => ({
      ...m,
      [activeThread]: [...(m[activeThread] || []), userMsg, { role: "assistant", content: "" }],
    }));
    setGenerating(true);

    let shown = 0;
    const timer = setInterval(() => {
      shown += 4;
      const done = shown >= reply.length;
      setMessagesByThread((m) => {
        const arr = [...(m[activeThread] || [])];
        arr[arr.length - 1] = {
          role: "assistant",
          content: reply.slice(0, shown),
          usage: done ? { prompt: 44, completion: 58, prefill: 401.2, decode: 73.5 } : undefined,
        };
        return { ...m, [activeThread]: arr };
      });
      if (done) {
        clearInterval(timer);
        setGenerating(false);
        setThreads((t) =>
          t.map((x) =>
            x.id === activeThread && x.title === "New thread"
              ? { ...x, title: text.slice(0, 40) }
              : x,
          ),
        );
      }
    }, 60);
  };

  /* ---- render ---- */

  if (stage === "landing") {
    return (
      <React.Fragment>
        <Landing onEnter={() => setStage("app")} />
        <StageBar stage={stage} setStage={setStage} />
      </React.Fragment>
    );
  }

  const noGPU = stage === "noGPU";
  const system = { ...MOCK_SYSTEM, webgpu: !noGPU };

  return (
    <React.Fragment>
      <div className="h-screen flex flex-col overflow-hidden">
        <header className="border-b border-line bg-bg px-4 py-2 flex items-center justify-between gap-4">
          <SystemRail system={system} />
          <div className="font-mono text-[10px] text-mute hidden md:block">
            {noGPU ? "inference unavailable" : modelReady ? shortenId(loadedModel) : "no model"}
          </div>
        </header>

        {noGPU ? (
          <WebGPUBlock />
        ) : (
          <div className="flex-1 flex min-h-0">
            <Sidebar
              threads={threads}
              activeId={activeThread}
              onSelect={setActiveThread}
              onNew={newThread}
              onDelete={deleteThread}
              model={loadedModel}
              engineState={engineState}
              onOpenPicker={() => setModal("picker")}
              onOpenSettings={() => setModal("settings")}
            />
            <main className="flex-1 min-w-0">
              {activeThread ? (
                <ChatPanel
                  messages={messages}
                  model={loadedModel}
                  modelReady={modelReady}
                  generating={generating}
                  templates={templates}
                  onSend={send}
                  onStop={() => setGenerating(false)}
                  onOpenPicker={() => setModal("picker")}
                  onParams={() => setModal("params")}
                />
              ) : (
                <div className="h-full grid-bg flex items-center justify-center">
                  <button
                    onClick={newThread}
                    className="font-mono text-[12px] px-4 py-2 border border-accent/60 text-accent hover:bg-accent/10"
                  >
                    + new chat
                  </button>
                </div>
              )}
            </main>
          </div>
        )}
      </div>

      <ModelPicker
        open={modal === "picker"}
        onClose={() => setModal(null)}
        system={system}
        loadedModel={loadedModel}
        engineState={engineState}
        progress={progress}
        defaultParams={defaultParams}
        setDefaultParams={setDefaultParams}
        onLoad={loadModel}
        onUnload={unloadModel}
        onEvict={evictModel}
        onAddCustom={() => setModal("custom")}
      />
      <SettingsModal
        open={modal === "settings"}
        onClose={() => setModal(null)}
        templates={templates}
        setTemplates={setTemplates}
      />
      <ThreadParams
        open={modal === "params"}
        onClose={() => setModal(null)}
        params={threadParams}
        setParams={setThreadParams}
        defaults={defaultParams}
        onReset={() => setThreadParams(defaultParams)}
      />
      <CustomModelModal open={modal === "custom"} onClose={() => setModal("picker")} />

      <StageBar stage={stage} setStage={setStage} />
    </React.Fragment>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
